<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="MPO Purchase Platform — hệ thống thông tin quản lý hoạt động thu mua. Đồ án môn Phân tích và thiết kế hệ thống.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>MPO Purchase Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ──────────────────────────────────────────────────────────────
   MPO Purchase Platform — design tokens
   Layout: rail điều hướng theo mạch thu mua + vùng làm việc + ngăn AI
   Palette đề xuất, suy ra từ logo Masan Consumer trên masanconsumer.com
   (xanh ~#164A8A, cam ~#DD7436 — lấy mẫu pixel, không phải brand guideline chính thức)
   ────────────────────────────────────────────────────────────── */
:root{
  --brand:#164A8A; --brand-700:#0E3466; --brand-300:#4E7FBC;
  --brand-wash:#EAF0F8; --brand-line:#C5D6EB;
  --accent:#C75F22; --accent-wash:#FBEEE4; --accent-line:#EFCFB4;

  --canvas:#F5F7FA; --surface:#FFFFFF; --surface-2:#FAFBFC; --surface-sunk:#EEF1F5;
  --ink:#141C26; --ink-2:#51607280; --ink-mid:#5A6A7D; --ink-soft:#8795A6;
  --line:#E0E6ED; --line-soft:#EDF1F5; --line-strong:#CBD4DE;

  --ok:#17704A; --ok-wash:#E6F3ED; --ok-line:#B4DCC9;
  --warn:#9A6411; --warn-wash:#FBF1DF; --warn-line:#EBD4A4;
  --risk:#A32F27; --risk-wash:#FBEAE8; --risk-line:#EFC2BC;
  --info:#15618F; --info-wash:#E6F1F8; --info-line:#B9D6E8;

  /* bảng màu phân loại cho biểu đồ — thứ tự cố định, đã qua validator
     (dải sáng, sàn chroma, tách màu cho người mù màu, tương phản nền) */
  --c1:#1C5A9E; --c2:#C2621F; --c3:#0E8A68; --c4:#6B4C9A;

  --ff:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px; --r-lg:10px;
  --sh:0 1px 2px rgba(20,28,38,.06),0 1px 1px rgba(20,28,38,.04);
  --sh-pop:0 12px 32px -8px rgba(20,28,38,.22),0 2px 8px rgba(20,28,38,.08);
  --rail:236px; --ai:408px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --brand:#6098D9; --brand-700:#92B9E7; --brand-300:#3A6BA4;
  --brand-wash:#152436; --brand-line:#2B4563;
  --accent:#E08A4D; --accent-wash:#30210F; --accent-line:#5A3A1C;

  --canvas:#0E1319; --surface:#151B23; --surface-2:#1A212A; --surface-sunk:#11171E;
  --ink:#E7ECF2; --ink-mid:#9BA9B9; --ink-soft:#73828F;
  --line:#242D38; --line-soft:#1D252F; --line-strong:#33404E;

  --ok:#5CBD91; --ok-wash:#13261F; --ok-line:#23493A;
  --warn:#D7A452; --warn-wash:#2A2112; --warn-line:#4D3C1C;
  --risk:#E0776C; --risk-wash:#2C1715; --risk-line:#542824;
  --info:#5FA8D6; --info-wash:#12222D; --info-line:#24455C;
  --c1:#4A8ACB; --c2:#D4793C; --c3:#1FA37E; --c4:#9479C6;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-pop:0 14px 36px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand:#6098D9; --brand-700:#92B9E7; --brand-300:#3A6BA4;
  --brand-wash:#152436; --brand-line:#2B4563;
  --accent:#E08A4D; --accent-wash:#30210F; --accent-line:#5A3A1C;

  --canvas:#0E1319; --surface:#151B23; --surface-2:#1A212A; --surface-sunk:#11171E;
  --ink:#E7ECF2; --ink-mid:#9BA9B9; --ink-soft:#73828F;
  --line:#242D38; --line-soft:#1D252F; --line-strong:#33404E;

  --ok:#5CBD91; --ok-wash:#13261F; --ok-line:#23493A;
  --warn:#D7A452; --warn-wash:#2A2112; --warn-line:#4D3C1C;
  --risk:#E0776C; --risk-wash:#2C1715; --risk-line:#542824;
  --info:#5FA8D6; --info-wash:#12222D; --info-line:#24455C;
  --c1:#4A8ACB; --c2:#D4793C; --c3:#1FA37E; --c4:#9479C6;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh-pop:0 14px 36px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--ff);font-size:14px;line-height:1.55;
     -webkit-font-smoothing:antialiased}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* type roles — mỗi vai trò thị giác một kích thước/độ đậm riêng */
.t-page{font-size:21px;font-weight:600;letter-spacing:-.022em;line-height:1.25;text-wrap:balance;margin:0}
.t-sec{font-size:12px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.t-card{font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin:0}
.t-body{font-size:13.5px;color:var(--ink-mid);margin:0}
.t-meta{font-size:12px;color:var(--ink-soft)}
.t-num{font-family:var(--fm);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.t-code{font-family:var(--fm);font-size:12px;font-weight:500;letter-spacing:-.01em}
.big{font-family:var(--fm);font-size:26px;font-weight:500;letter-spacing:-.035em;line-height:1}

/* ── shell ── */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100%;overflow:hidden}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.rail-top{padding:14px 14px 10px;border-bottom:1px solid var(--line-soft)}
.brandmark{display:flex;align-items:center;gap:9px}
.brandmark .nm{font-size:13.5px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.brandmark .sub{font-size:10.5px;color:var(--ink-soft);letter-spacing:.055em;text-transform:uppercase}
.rail-scroll{flex:1;overflow-y:auto;padding:10px 8px 14px}
.navgrp{margin-bottom:3px}
.navgrp-h{display:flex;align-items:center;gap:7px;padding:9px 8px 5px}
.navgrp-h .t{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.navgrp-h .ln{flex:1;height:1px;background:var(--line-soft)}
.navitem{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:var(--r);
  color:var(--ink-mid);font-size:13px;font-weight:450;text-align:left;transition:background .12s,color .12s}
.navitem:hover{background:var(--surface-sunk);color:var(--ink)}
.navitem.on{background:var(--brand-wash);color:var(--brand-700);font-weight:600}
.navitem.on svg{color:var(--brand)}
.navitem svg{flex:none;color:var(--ink-soft)}
.navitem .cnt{margin-left:auto;font-family:var(--fm);font-size:11px;font-weight:500;color:var(--ink-soft);
  background:var(--surface-sunk);border-radius:20px;padding:1px 6px;min-width:22px;text-align:center}
.navitem.on .cnt{background:var(--surface);color:var(--brand-700)}
.navitem .cnt.hot{background:var(--risk-wash);color:var(--risk)}

/* chuỗi mạch thu mua vẽ dọc theo rail */
.chain{position:relative;padding-left:11px}
.chain::before{content:"";position:absolute;left:3px;top:14px;bottom:14px;width:1.5px;
  background:linear-gradient(180deg,var(--brand-line),var(--accent-line))}
.chain .navgrp-h{padding-left:0}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:var(--surface);border-bottom:1px solid var(--line)}
.srch{flex:1;max-width:340px;min-width:210px;position:relative}
.srch input{width:100%;height:32px;padding:0 10px 0 31px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface-2);font-size:13px}
.srch input::placeholder{color:var(--ink-soft)}
.srch svg{position:absolute;left:9px;top:8px;color:var(--ink-soft)}
.demo-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--warn);background:var(--warn-wash);border:1px solid var(--warn-line);
  border-radius:4px;padding:2.5px 7px}
.work{flex:1;overflow-y:auto;overflow-x:hidden}
.page{padding:20px 22px 40px;max-width:1360px}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head .lede{font-size:13.5px;color:var(--ink-mid);max-width:62ch;margin:5px 0 0}

/* ── primitives ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.card-b{padding:14px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink);
  transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-sunk);border-color:var(--line-strong)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-700);border-color:var(--brand-700)}
.btn.sm{height:27px;padding:0 9px;font-size:12.5px}
.btn.gho{border-color:transparent;background:transparent;color:var(--ink-mid)}
.btn.gho:hover{background:var(--surface-sunk);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;
  border-radius:20px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-mid);white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-wash);border-color:var(--ok-line)}
.chip.warn{color:var(--warn);background:var(--warn-wash);border-color:var(--warn-line)}
.chip.risk{color:var(--risk);background:var(--risk-wash);border-color:var(--risk-line)}
.chip.info{color:var(--info);background:var(--info-wash);border-color:var(--info-line)}
.chip.brand{color:var(--brand-700);background:var(--brand-wash);border-color:var(--brand-line)}
.chip.acc{color:var(--accent);background:var(--accent-wash);border-color:var(--accent-line)}
/* trạng thái không chỉ dựa vào màu: thêm dấu hình học */
.chip .dot{width:5px;height:5px;border-radius:5px;background:currentColor;flex:none}
.chip.sq .dot{border-radius:1px}
.chip.tri .dot{width:0;height:0;border-radius:0;background:none;
  border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-bottom:6px solid currentColor}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 12px;font-size:13px;font-weight:500;color:var(--ink-mid);border-bottom:2px solid transparent;
  margin-bottom:-1px;white-space:nowrap;transition:color .12s,border-color .12s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand-700);border-bottom-color:var(--brand);font-weight:600}
.tab .n{font-family:var(--fm);font-size:11px;color:var(--ink-soft);margin-left:5px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;
  color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--surface-2);position:sticky;top:0;z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr.sel{background:var(--brand-wash)}
tbody tr[data-click]{cursor:pointer}
tbody tr[data-click]:hover{background:var(--surface-sunk)}
tbody tr.sel[data-click]:hover{background:var(--brand-wash)}
td.num{font-family:var(--fm);font-variant-numeric:tabular-nums;text-align:right;letter-spacing:-.02em}
td .t-code,td.t-code{white-space:nowrap}
td.num{white-space:nowrap}
.tw{overflow-x:auto;border-radius:0 0 var(--r-lg) var(--r-lg)}

.meter{height:5px;border-radius:5px;background:var(--surface-sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.meter i.ok{background:var(--ok)} .meter i.warn{background:var(--warn)} .meter i.risk{background:var(--risk)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.kv:last-child{border-bottom:none}
.kv dt{color:var(--ink-soft);flex:none}
.kv dd{margin:0;text-align:right;font-weight:500}

.empty{padding:34px 16px;text-align:center;color:var(--ink-soft)}
.empty .t{font-size:13.5px;font-weight:500;color:var(--ink-mid);margin:9px 0 3px}

/* ── drawer ── */
.scrim{position:fixed;inset:0;background:rgba(14,19,25,.34);z-index:60;animation:fade .14s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,94vw);background:var(--surface);z-index:61;
  display:flex;flex-direction:column;box-shadow:var(--sh-pop);animation:slide .18s cubic-bezier(.2,.7,.3,1);
  padding-right:env(safe-area-inset-right,0px)}
.drawer-h{flex:none;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.drawer-b{flex:1;overflow-y:auto;padding:16px}
.drawer-f{flex:none;padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;
  justify-content:flex-end;background:var(--surface-2)}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(18px);opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── AI ── */
.ai-panel{width:var(--ai);flex:none;border-left:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;overflow:hidden}
.ai-h{flex:none;padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.ai-ctx{flex:none;padding:8px 13px;background:var(--brand-wash);border-bottom:1px solid var(--brand-line);
  font-size:11.5px;color:var(--brand-700);display:flex;align-items:center;gap:6px}
.ai-log{flex:1;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:13px}
.ai-in{flex:none;border-top:1px solid var(--line);padding:10px 13px 12px}
.ai-in textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;resize:none;
  font-size:13px;background:var(--surface-2);min-height:62px}
.msg-u{align-self:flex-end;max-width:88%;background:var(--brand);color:#fff;padding:8px 11px;
  border-radius:10px 10px 2px 10px;font-size:13px}
.msg-a{max-width:100%;font-size:13px}
.msg-a .ai-title{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 5px}
.msg-a p{margin:0 0 8px;color:var(--ink-mid);font-size:13px}
.ai-box{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 var(--r) var(--r) 0;
  background:var(--surface-2);padding:9px 11px;margin:0 0 9px}
.ai-src{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.ai-src button{font-size:11.5px;font-weight:500;color:var(--brand-700);background:var(--brand-wash);
  border:1px solid var(--brand-line);border-radius:4px;padding:2px 7px;display:inline-flex;align-items:center;gap:4px}
.ai-src button:hover{background:var(--surface)}
.ai-note{font-size:11.5px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:7px;margin-top:4px}
.prompt{width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;
  font-size:12.5px;color:var(--ink-mid);background:var(--surface);transition:border-color .12s,background .12s}
.prompt:hover{border-color:var(--brand-line);background:var(--brand-wash);color:var(--brand-700)}
.typing i{display:inline-block;width:4px;height:4px;border-radius:4px;background:var(--ink-soft);margin-right:3px;
  animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ── toast ── */
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:80;display:flex;
  flex-direction:column;gap:8px;align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:var(--canvas);padding:9px 14px;
  border-radius:var(--r);box-shadow:var(--sh-pop);font-size:13px;animation:up .2s ease;max-width:92vw}
.toast.warn{background:var(--warn);color:#fff}
@keyframes up{from{transform:translateY(8px);opacity:0}}

/* ── chrome kiểu phần mềm doanh nghiệp (tham chiếu AMIS Mua hàng) ── */
.topbar{height:50px;gap:8px}
.iconbtn{width:30px;height:30px;border-radius:var(--r);display:inline-grid;place-items:center;
  color:var(--ink-soft);position:relative;transition:background .12s,color .12s}
.iconbtn:hover{background:var(--surface-sunk);color:var(--ink)}
.badge{position:absolute;top:1px;right:1px;min-width:15px;height:15px;padding:0 3px;border-radius:9px;
  background:var(--risk);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;
  font-family:var(--fm);border:1.5px solid var(--surface)}
.orgsel{display:flex;align-items:center;gap:5px;height:28px;padding:0 8px;border-radius:var(--r);
  font-size:12.5px;color:var(--ink-mid);max-width:230px;transition:background .12s}
.orgsel:hover{background:var(--surface-sunk)}
.orgsel .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--ink)}
.vsep{width:1px;height:20px;background:var(--line);flex:none}
.pop{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--sh-pop);padding:5px;max-height:72vh;overflow-y:auto}
.popitem{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:var(--r);font-size:13px}
.popitem:hover{background:var(--surface-sunk)}
.popitem.on{background:var(--brand-wash);color:var(--brand-700);font-weight:600}

/* dòng trạng thái có thanh tỷ lệ — mẫu "Đề nghị mua hàng" */
.brk{display:flex;align-items:center;gap:10px;padding:5px 0}
.brk .lb{flex:none;width:96px;font-size:12.5px;color:var(--ink-mid)}
.brk .tr{flex:1;min-width:0;height:9px;border-radius:9px;background:var(--surface-sunk);overflow:hidden}
.brk .tr i{display:block;height:100%;border-radius:9px}
.brk .vl{flex:none;width:34px;text-align:right;font-family:var(--fm);font-size:12.5px;font-weight:500}

/* chỉ báo tiến trình trong dòng bảng — mẫu "Trạng thái QT" */
.flow{display:inline-flex;align-items:center}
.flow .nd{width:11px;height:11px;border-radius:11px;border:1.6px solid var(--line-strong);
  background:var(--surface);flex:none;position:relative}
.flow .nd.done{background:var(--brand);border-color:var(--brand)}
.flow .nd.cur{border-color:var(--brand);border-width:2.4px;background:var(--surface)}
.flow .nd.bad{background:var(--risk);border-color:var(--risk)}
.flow .lk{width:13px;height:1.6px;background:var(--line-strong);flex:none}
.flow .lk.done{background:var(--brand)}

/* chọn nhiều dòng */
.cbx{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line-strong);background:var(--surface);
  display:inline-grid;place-items:center;flex:none;transition:background .1s,border-color .1s}
.cbx.on{background:var(--brand);border-color:var(--brand)}

function AIMark({s=20}) {

/* Chỉ báo tiến trình quy trình trong dòng bảng */
function Flow({steps, at, bad, title}) {
  return <span className="flow" title={title || steps.map((s,i)=>(i<=at?'✓ ':'· ')+s).join('\n')}>
    {steps.map((s,i)=><React.Fragment key={i}>
      {i>0 && <span className={'lk'+(i<=at?' done':'')}/>}
      <span className={'nd'+(bad && i===at ? ' bad' : i<at ? ' done' : i===at ? ' cur' : '')}/>
    </React.Fragment>)}
  </span>;
}

/* Dòng trạng thái có thanh tỷ lệ */
function Breakdown({rows, total}) {
  const max = total || rows.reduce((a,r)=>a+r.v,0) || 1;
  return <div>{rows.map((r,i)=>
    <div key={i} className="brk">
      <span className="lb">{r.k}</span>
      <span className="tr"><i style={{width:Math.max(r.v?3:0,r.v/max*100)+'%',
        background:r.c||'var(--brand)'}}/></span>
      <span className="vl" style={{color:r.c&&r.v?r.c:'var(--ink)'}}>{r.v}</span>
    </div>)}</div>;
}

function Check({on}) {
  return <span className={'cbx'+(on?' on':'')}>{on && <I n="check" s={9} c="#fff"/>}</span>;
}

function CardTools({period, onPeriod}) {
  return <div style={{display:'flex',alignItems:'center',gap:2,marginLeft:'auto'}}>
    {period && <select value={period} onChange={e=>onPeriod&&onPeriod(e.target.value)}
      style={{height:25,border:'1px solid var(--line)',borderRadius:'var(--r)',padding:'0 5px',
        background:'var(--surface)',fontSize:12,color:'var(--ink-mid)'}}>
      <option>Tháng này</option><option>Quý này</option><option>12 tháng</option></select>}
    <button className="iconbtn" style={{width:26,height:26}} title="Làm mới"><I n="refresh" s={14}/></button>
  </div>;
}

function Logo() {
  return <div className="brandmark">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect width="24" height="24" rx="6" fill="var(--brand)"/>
      <path d="M5 16.5C8 11 12.5 8 19 7.5" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" opacity=".92"/>
      <circle cx="8" cy="14.6" r="1.7" fill="#fff"/>
      <circle cx="12.3" cy="12" r="1.2" fill="var(--accent)"/>
    </svg>
    <div>
      <div className="nm">MPO Purchase</div>
      <div className="sub">Masan Consumer</div>
    </div>
  </div>;
}

/* ── primitives ── */
function Chip({k='', sh='', children}) {
  return <span className={'chip '+(k||'')+' '+sh}><i className="dot"/>{children}</span>;
}
function Money({v, can=true, suffix=' tỷ'}) {
  if (!can) return <span className="t-meta" title="Vai trò hiện tại không được xem dữ liệu giá">—</span>;
  return <span className="t-num">{String(v).replace('.', ',')}{suffix}</span>;
}
function Meter({v, k='', h=5}) {
  return <div className="meter" style={{height:h}}><i className={k} style={{width:Math.max(2,Math.min(100,v))+'%'}}/></div>;
}
function Empty({icon='search', t, s}) {
  return <div className="empty"><I n={icon} s={24} c="var(--line-strong)"/>
    <div className="t">{t}</div><div className="t-meta">{s}</div></div>;
}
function SectionBar({t, right}) {
  return <div style={{display:'flex',alignItems:'center',gap:12,margin:'0 0 10px'}}>
    <h2 className="t-sec">{t}</h2>
    <div style={{flex:1,height:1,background:'var(--line-soft)'}}/>
    {right}
  </div>;
}
function Drawer({open, onClose, title, sub, chips, children, footer}) {
  useEffect(()=>{
    if(!open) return;
    const h = e => { if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h);
  },[open,onClose]);
  if (!open) return null;
  return <React.Fragment>
    <div className="scrim" onClick={onClose}/>
    <aside className="drawer" role="dialog" aria-label={title}>
      <div className="drawer-h">
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:5}}>{chips}</div>
          <h2 className="t-card" style={{fontSize:16}}>{title}</h2>
          {sub && <div className="t-meta" style={{marginTop:2}}>{sub}</div>}
        </div>
        <button className="btn gho sm" onClick={onClose} aria-label="Đóng"><I n="x" s={16}/></button>
      </div>
      <div className="drawer-b">{children}</div>
      {footer && <div className="drawer-f">{footer}</div>}
    </aside>
  </React.Fragment>;
}

/* ── AI Assistant ─────────────────────────────────────────────
   Năng lực hội thoại có thành phần ở cả ba tầng, không phải tầng thứ tư.
   Kế thừa danh tính + quyền của người dùng hiện tại; chỉ đọc và soạn thảo. */
function aiPrompts(page, role, ctx) {
  const n = ctx && ctx.label ? ctx.label : null;
  const base = {
    overview: ['Hôm nay tôi cần ưu tiên việc gì?','Những PO nào đang có rủi ro trễ giao?','Tóm tắt các hạn chót trong 7 ngày tới'],
    vendors:  n? ['Tóm tắt tình trạng hồ sơ '+n,'Chứng nhận nào của '+n+' sắp hết hạn?','Điều gì đang kéo điểm đánh giá của '+n+' xuống?']
                : ['Nhà cung cấp nào có chứng nhận sắp hết hạn?','So sánh OTIF của nhóm hàng bao bì','Những NCC nào cần tái xếp hạng Tier?'],
    bidding:  n? ['So sánh các hồ sơ dự thầu của '+n,'Hồ sơ nào thiếu thông tin hoặc chưa đạt tiêu chí?','Giải thích cơ sở của bảng điểm so sánh']
                : ['Gói thầu nào đang quá hạn đánh giá?','Tóm tắt các gói thầu đang mở'],
    contracts:n? ['Tóm tắt các điều khoản chính của '+n,'Điều khoản phạt chậm giao quy định thế nào?','Hợp đồng này thiếu nội dung nào so với mẫu chuẩn?']
                : ['Hợp đồng nào sắp hết hiệu lực trong 30 ngày?','NDA nào đang chờ Pháp lý rà soát?'],
    po:       n? ['Vì sao '+n+' bị trễ?','Những việc cần theo dõi tiếp theo của PO này','Soạn email nhắc nhà cung cấp']
                : ['Tổng hợp các PO đang giao trễ','PO nào thuộc nhà máy MCH-BD đến hạn tuần này?'],
    quality:  n? ['Tóm tắt kết quả IQC của '+n,'Chỉ tiêu nào không đạt và lệch bao nhiêu?','Lô này liên quan đến NCR/SCAR nào?']
                : ['Lô nào đang chờ kết luận IQC?','Nhà cung cấp nào có nhiều NCR nhất quý này?'],
    scorecard:n? ['Giải thích điểm scorecard của '+n,'Tiến độ CAPA của hồ sơ này đến đâu?']
                : ['SCAR nào quá hạn phản hồi?','Nhà cung cấp Key Tier-1 nào có rủi ro ESG?'],
    analytics:['Vẽ biểu đồ OTIF 6 tháng theo Tier','Chi tiêu đang tập trung vào ai?','Hồ sơ tồn đọng ở bước nào?','Mô hình dữ liệu gồm những thực thể nào?'],
    arch:     ['AI Assistant nằm ở tầng nào trong kiến trúc?','Phân quyền RBAC và ABAC khác nhau thế nào?','Presentation Layer gồm những kênh nào?'],
    s_home:   ['Tôi cần làm gì tiếp theo?','Hồ sơ của tôi còn thiếu tài liệu nào?','Có gói thầu nào đang mời tôi tham gia?'],
    s_profile:['Hồ sơ năng lực của tôi còn thiếu gì?','Chứng nhận nào của tôi sắp hết hạn?'],
    s_tenders:['Tôi đang tham gia gói thầu nào?','Hạn nộp hồ sơ của gói GT-2026-041 là khi nào?'],
    s_orders: ['PO nào của tôi đang đến hạn giao?','Tôi cần nộp chứng từ gì cho PO này?'],
    s_capa:   ['Tôi cần nộp những gì cho SCAR này?','Hạn phản hồi CAPA của tôi là khi nào?'],
  };
  return base[page] || base.overview;
}

/* Kịch bản trả lời — mô phỏng trên dữ liệu demo, không kết nối dữ liệu thật */
function aiAnswer(q, page, role, ctx) {
  const ql = q.toLowerCase();
  const can = role.price;
  const deny = (what) => ({ title:'Ngoài phạm vi quyền',
    body:[`Vai trò ${role.name} không được cấp quyền xem ${what}. AI Assistant kế thừa đúng quyền của bạn, nên không thể trả lời phần này.`],
    note:'Giới hạn kiểm soát: '+role.limit, src:[] });

  if (/phê duyệt|duyệt giúp|approve|chấp thuận/.test(ql))
    return { title:'Không thực hiện qua hội thoại',
      body:['Tôi không có thẩm quyền phê duyệt nhà cung cấp, gói thầu, hợp đồng hay PO. Việc phê duyệt phải thực hiện trên màn hình nghiệp vụ tương ứng, qua quy trình và cơ chế xác nhận có ghi nhật ký.',
            'Tôi có thể giúp bạn chuẩn bị: tóm tắt hồ sơ, đối chiếu tiêu chí, hoặc soạn nháp nội dung trình duyệt.'],
      note:'AI chỉ hỗ trợ tra cứu, tổng hợp, phân tích và soạn thảo trong phạm vi quyền của người dùng.', src:[] };

  if (/giá|price|báo giá|chi phí/.test(ql) && !can) return deny('dữ liệu giá và điều kiện thương mại');

  if (/ưu tiên|hôm nay|việc gì|cần làm/.test(ql)) {
    const mine = TASKS.filter(t=>t.roles.includes(role.id));
    const risk = mine.filter(t=>t.pri==='risk');
    return { title:'Việc cần xử lý trong phạm vi của bạn',
      body:[`Trong phạm vi ${role.scope.toLowerCase()}, hiện có ${mine.length} việc đang mở, trong đó ${risk.length} việc đã quá hạn.`],
      list: mine.slice(0,4).map(t=>({t:t.t, s:t.sla, page:t.page, ref:t.ref})),
      note:'Sắp xếp theo mức quá hạn so với SLA, không theo giá trị giao dịch.',
      src: risk.slice(0,2).map(t=>({l:t.ref||'Việc #'+t.id, page:t.page, ref:t.ref})) };
  }

  if (/trễ|chậm|delay|rủi ro giao/.test(ql)) {
    const late = POS.filter(p=>p.risk==='risk');
    return { title:'PO đang có rủi ro trễ giao',
      body:[`Có ${late.length} PO vượt ngày giao cam kết. Dữ liệu lấy từ trạng thái giao hàng và ASN đã ghi nhận trên hệ thống.`],
      table:{ h:['PO','Nhà cung cấp','Trễ','Nguyên nhân ghi nhận'],
        r: late.map(p=>[p.code, p.vn, p.late+' ngày', p.reason.split(';')[0]]) },
      note:'Nguyên nhân là nội dung do người dùng hoặc nhà cung cấp ghi nhận, không phải suy luận của tôi.',
      src: late.map(p=>({l:p.code, page:'po', ref:p.code})) };
  }

  if (/biểu đồ|vẽ|xu hướng|otif|theo thời gian|6 tháng/.test(ql)) {
    const g = { 'Key Tier-1':[], 'Tier-1':[], 'Tier-2':[] };
    VENDORS.forEach(v=>{ if(v.deliv.length && g[v.tier]) g[v.tier].push(v.deliv.map(d=>d.v)); });
    const series = Object.keys(g).filter(k=>g[k].length).map(k=>({ n:k,
      v: g[k][0].map((_,i)=> Math.round(g[k].reduce((a,arr)=>a+arr[i],0)/g[k].length*10)/10) }));
    return { title:'OTIF 6 tháng theo nhóm Tier',
      body:['Câu hỏi về thay đổi theo thời gian nên tôi dùng biểu đồ đường: mỗi nhóm Tier là một chuỗi trên cùng một trục.'],
      chart:{ kind:'line', title:'OTIF (%) — T5 đến T10', x:['T5','T6','T7','T8','T9','T10'],
              series, yMin:75, yMax:100, unit:'%' },
      body2:'Nhóm Tier-2 nằm dưới mục tiêu nội bộ 95% trong cả sáu tháng; khoảng cách với Key Tier-1 không thu hẹp.',
      note:'Số liệu là trung bình cộng theo nhóm trên dữ liệu demo, chưa tính trọng số theo sản lượng.',
      src:[{l:'Mở trang Phân tích', page:'analytics', ref:''}] };
  }

  if (/chi tiêu|phân bổ|tập trung vào ai|spend/.test(ql)) {
    if (!can) return deny('dữ liệu chi tiêu');
    const rows = VENDORS.filter(v=>v.spend>0).sort((a,b)=>b.spend-a.spend)
      .map(v=>({k:v.name, v:v.spend, sub:v.tier}));
    const tot = rows.reduce((a,r)=>a+r.v,0);
    const top2 = rows.slice(0,2).reduce((a,r)=>a+r.v,0);
    return { title:'Phân bổ chi tiêu 12 tháng',
      body:['Câu hỏi về độ lớn giữa các hạng mục rời rạc nên tôi dùng cột xếp hạng thay vì hình tròn chia lát.'],
      chart:{ kind:'bar', title:'Chi tiêu theo nhà cung cấp (tỷ đồng)', rows, unit:'tỷ đồng' },
      body2:'Hai nhà cung cấp dẫn đầu chiếm '+Math.round(top2/tot*100)+'% tổng chi tiêu của nhóm hàng bạn phụ trách, cả hai đều thuộc Key Tier-1.',
      note:'Chi tiêu lấy từ dữ liệu giao dịch 12 tháng gần nhất trong phạm vi quyền của bạn.',
      src:[{l:'Mở trang Phân tích', page:'analytics', ref:''}] };
  }

  if (/chứng nhận|certificate|hết hạn|sắp hết/.test(ql)) {
    const rows = [];
    VENDORS.forEach(v=>v.certs.forEach(c=>{ if(c.st==='warn'||c.st==='risk'||c.st==='missing')
      rows.push([v.name, c.n, c.exp==='—'?'Chưa nộp':c.exp]); }));
    return { title:'Chứng nhận cần theo dõi',
      body:['Danh sách gồm chứng nhận hết hạn trong 60 ngày tới và chứng nhận chưa được nộp.'],
      table:{ h:['Nhà cung cấp','Chứng nhận','Hết hạn'], r:rows },
      note:'Hệ thống không tự xác minh tính xác thực của chứng nhận; cần đối chiếu bản gốc khi rà soát.',
      src:[{l:'NCC-0588', page:'vendors', ref:'NCC-0588'},{l:'NCC-1120', page:'vendors', ref:'NCC-1120'}] };
  }

  if (/so sánh|hồ sơ dự thầu|dự thầu|bảng điểm|cơ sở/.test(ql)) {
    const t = (ctx && ctx.tender) || TENDERS[0];
    if (!t.bids.length) return { title:'Chưa đủ dữ liệu',
      body:[`Gói ${t.code} chưa nhận được hồ sơ dự thầu nào, nên chưa thể so sánh.`],
      note:'Tôi chỉ tổng hợp trên hồ sơ đã nộp; không suy đoán năng lực nhà cung cấp chưa tham gia.', src:[] };
    const sc = t.bids.map(b=>({b, total: b.s.reduce((a,x,i)=>a + x*t.criteria[i].w/100, 0)}));
    sc.sort((a,b)=>b.total-a.total);
    return { title:'So sánh hồ sơ — '+t.code,
      body:[`${t.bids.length} hồ sơ được chấm theo ${t.criteria.length} nhóm tiêu chí với trọng số đã xác định trước khi mở thầu.`],
      table:{ h:['Nhà cung cấp','Điểm tổng', can?'Giá chào':'Giá', 'Điểm yếu'],
        r: sc.map(x=>[x.b.name, x.total.toFixed(1), can? String(x.b.price).replace('.',',')+' tỷ':'—', x.b.gap||'—']) },
      body2:`Chênh lệch giữa hồ sơ dẫn đầu và hồ sơ thứ hai là ${(sc[0].total-sc[1].total).toFixed(1)} điểm. Hồ sơ có giá thấp nhất ${can?'('+String(Math.min.apply(null,t.bids.map(b=>b.price))).replace('.',',')+' tỷ) ':''}không phải hồ sơ dẫn đầu vì chưa đáp ứng nhóm tiêu chí tuân thủ.`,
      note:'Điểm số là dữ liệu do người đánh giá nhập, trọng số lấy từ hồ sơ mời thầu. Tôi không tự chấm điểm và không đề xuất bên trúng thầu.',
      src:[{l:t.code, page:'bidding', ref:t.code}] };
  }

  if (/tóm tắt.*hợp đồng|điều khoản|phạt chậm|hợp đồng nào/.test(ql)) {
    const c = (ctx && ctx.contract) || CONTRACTS[0];
    return { title:'Tóm tắt điều khoản — '+c.code,
      body:[`${c.type}, phiên bản ${c.ver}, hiệu lực ${c.eff} đến ${c.exp}. Trạng thái: ${c.st}.`],
      list: c.terms.map(t=>({t})),
      note:'Tóm tắt dựa trên phiên bản '+c.ver+' đang lưu. Nội dung pháp lý cần được Pháp lý đối chiếu với bản ký gốc.',
      src:[{l:c.code, page:'contracts', ref:c.code}] };
  }

  if (/iqc|chất lượng|lô|ncr|kết luận/.test(ql)) {

      body:[`Lô thuộc ${l.po}, nhà cung cấp ${l.vn}, tiếp nhận ${l.recv} tại ${l.plant}. Kết luận hiện tại: ${l.res}.`],

      body2: fail.length? `${fail.length} chỉ tiêu không đạt: ${fail.map(f=>f.k).join(', ')}.` : 'Toàn bộ chỉ tiêu đạt đặc tả.',
      note: l.ncr? 'Đã phát hành '+l.ncr+(l.scar? ' và '+l.scar:'')+'.' : 'Chưa phát sinh NCR cho lô này.',

      src:[{l:s.code, page:'scorecard', ref:s.code}] };

  if (/soạn|email|nhắc|draft/.test(ql)) {
    const p = (ctx && ctx.po) || POS.find(x=>x.risk==='risk');

      draft:`Kính gửi Quý ${p.vn},\n\nĐơn hàng ${p.code} (${p.mat}, ${p.qty}, giao tại ${p.plant}) có ngày giao cam kết ${p.promised} và hiện đã quá hạn ${p.late} ngày. Chúng tôi chưa nhận được ASN cập nhật cho đợt giao này.\n\nĐề nghị Quý công ty xác nhận lịch giao mới trước 17h ngày làm việc kế tiếp, hoặc nêu rõ phương án giao từng phần để chúng tôi cân đối kế hoạch sản xuất.\n\nTrân trọng,\nBộ phận Thu mua — Masan Consumer`,
      note:'Tôi không tự gửi email. Nội dung là bản nháp, bạn chỉnh sửa và gửi từ hộp thư của mình.',
      src:[{l:p.code, page:'po', ref:p.code}] };
  }

  if (/mô hình dữ liệu|thực thể|erd|bảng dữ liệu|quan hệ dữ liệu/.test(ql)) {

      note:'Mọi thao tác ghi đều để lại bản ghi trong AuditLog; dữ liệu đã phê duyệt được sửa bằng phiên bản mới thay vì ghi đè.',
      src:[{l:'Xem sơ đồ ERD', page:'analytics', ref:''}] };
  }

  if (/kiến trúc|tầng|rbac|abac|layer|presentation/.test(ql)) {
    return { title:'Kiến trúc và phân quyền',
      body:['MPO Purchase Platform có ba tầng: Presentation Layer (Purchase Portal, Supplier Portal, ứng dụng di động, Chat Widget), Business Layer (API Services, điều phối & chính sách, 8 mô-đun nghiệp vụ, Business Entities) và Data Layer (DAO/Repository, xử lý dữ liệu, Retrieval Service, Integration Adapters, nguồn dữ liệu).',
            'AI Assistant không phải tầng thứ tư. Đây là năng lực hội thoại có thành phần ở cả ba tầng và dùng lại chính dịch vụ nghiệp vụ cùng cơ chế phân quyền của nền tảng.',
            'RBAC xác định bạn được làm gì theo vai trò. ABAC bổ sung điều kiện theo thuộc tính dữ liệu và ngữ cảnh — nhà máy, nhóm hàng, kho, mã tổ chức nhà cung cấp. Một yêu cầu chỉ được chấp nhận khi thỏa cả hai.'],
      note:'Mọi truy vấn của tôi đều đi qua API Services và được kiểm tra lại tại lớp dịch vụ, không chỉ ở giao diện chat.',
      src:[{l:'Trang kiến trúc', page:'arch', ref:''}] };
  }

  if (/hồ sơ của tôi|thiếu|bổ sung|nộp gì/.test(ql) && role.id==='supplier') {
    const me = VENDORS.find(v=>v.code==='NCC-0412');
    const warn = me.certs.filter(c=>c.st!=='ok');
    return { title:'Hồ sơ của '+me.name,
      body:[`Hồ sơ đang ở trạng thái "${me.status}". Có ${warn.length} tài liệu cần xử lý trước khi tham gia gói thầu mới.`],
      list: warn.map(c=>({t:c.n, s: c.exp==='—'?'Chưa nộp':'Hết hạn '+c.exp})),
      note:'Bạn chỉ xem được dữ liệu thuộc tổ chức NCC-0412.',
      src:[{l:'Hồ sơ năng lực', page:'s_profile', ref:''}] };
  }

  if (role.id==='supplier' && /gói thầu|mời thầu|tham gia/.test(ql)) {
    return { title:'Gói thầu liên quan đến bạn',
      body:['Bạn đang tham gia 1 gói thầu đang đánh giá và được mời 1 gói đang nhận hồ sơ.'],
      table:{ h:['Mã gói','Nội dung','Hạn'], r:[['GT-2026-038','Tiêu đen nguyên hạt — khung 12 tháng','02/11/2026'],
                                               ['GT-2026-045','Dầu thực vật tinh luyện','14/11/2026']] },
      note:'Bạn không xem được hồ sơ, giá chào hay kết quả đánh giá của nhà cung cấp khác.',
      src:[{l:'Gói thầu của tôi', page:'s_tenders', ref:''}] };
  }

  return { title:'Chưa đủ dữ liệu để trả lời chắc chắn',
    body:[`Tôi chưa tìm thấy dữ liệu khớp với câu hỏi trong phạm vi ${role.scope.toLowerCase()}.`,
          'Bạn có thể nêu rõ mã hồ sơ (ví dụ PO-26-10-0471, GT-2026-041, NCC-0412) hoặc chọn một gợi ý bên dưới.'],
    note:'Tôi phân biệt dữ liệu có sẵn trên hệ thống với suy luận. Khi không có dữ liệu, tôi nói rõ thay vì phỏng đoán.',
    src:[] };
}

function AIPanel({open, onClose, page, role, ctx, go}) {
  const [log, setLog] = useState([]);
  const [val, setVal] = useState('');
  const [busy, setBusy] = useState(false);
  const endRef = useRef(null);
  useEffect(()=>{ if(endRef.current) endRef.current.scrollIntoView({block:'end'}); },[log,busy]);
  useEffect(()=>{ setLog([]); },[role.id]);

  const ask = (q) => {
    if (!q.trim() || busy) return;
    setLog(l=>[...l,{r:'u',t:q}]); setVal(''); setBusy(true);
    setTimeout(()=>{ setLog(l=>[...l,{r:'a',a:aiAnswer(q,page,role,ctx)}]); setBusy(false); }, 480);
  };
  if (!open) return null;
  const prompts = aiPrompts(page, role, ctx);

  return <aside className="ai-panel" aria-label="MPO AI Assistant">
    <div className="ai-h">
      <AIMark s={21}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13.5,fontWeight:600,letterSpacing:'-.01em'}}>MPO AI Assistant</div>
        <div className="t-meta" style={{fontSize:11}}>{role.name} · chỉ đọc & soạn thảo</div>
      </div>
      <button className="btn gho sm" onClick={onClose} aria-label="Đóng trợ lý"><I n="x" s={16}/></button>
    </div>
    <div className="ai-ctx"><I n="link" s={13}/>
      <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
        Ngữ cảnh: {ctx && ctx.label ? ctx.label : PAGE_TITLE[page]}</span>
    </div>
    <div className="ai-log">
      {log.length===0 && <div>
        <p className="t-body" style={{marginBottom:12}}>
          Tôi tra cứu và tổng hợp trong đúng phạm vi quyền của bạn: {role.scope.toLowerCase()}.
        </p>
        <div className="t-sec" style={{marginBottom:7,fontSize:11}}>Gợi ý theo việc bạn đang làm</div>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {prompts.map((p,i)=><button key={i} className="prompt" onClick={()=>ask(p)}>{p}</button>)}
        </div>
      </div>}
      {log.map((m,i)=> m.r==='u'
        ? <div key={i} className="msg-u">{m.t}</div>
        : <AIAnswer key={i} a={m.a} go={go}/>)}
      {busy && <div className="typing t-meta"><i/><i/><i/> đang tra cứu…</div>}
      <div ref={endRef}/>
    </div>
    <div className="ai-in">
      <textarea value={val} onChange={e=>setVal(e.target.value)} rows={2} id="ai-input"
        placeholder="Hỏi về hồ sơ, gói thầu, PO, lô hàng…"
        onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(val);} }}/>
      <div style={{display:'flex',alignItems:'center',gap:8,marginTop:7}}>
        <span className="t-meta" style={{flex:1,fontSize:11}}>AI không phê duyệt và không gửi email thay bạn.</span>
        <button className="btn pri sm" onClick={()=>ask(val)} disabled={!val.trim()||busy}>
          <I n="send" s={14}/> Gửi</button>
      </div>
    </div>
  </aside>;
}

function AIAnswer({a, go}) {
  return <div className="msg-a">
    <div className="ai-title">{a.title}</div>
    {(a.body||[]).map((p,i)=><p key={i}>{p}</p>)}
    {a.list && <div className="ai-box">{a.list.map((x,i)=>
      <div key={i} style={{display:'flex',gap:8,padding:'3px 0',fontSize:12.5}}>
        <span style={{flex:1}}>{x.t}</span>
        {x.s && <span className="t-meta" style={{flex:'none'}}>{x.s}</span>}
      </div>)}</div>}
    {a.chart && <AIChart spec={a.chart}/>}
    {a.table && <div className="ai-box" style={{padding:0,overflowX:'auto'}}>
      <table style={{fontSize:12}}>
        <thead><tr>{a.table.h.map((h,i)=><th key={i} style={{padding:'6px 9px',background:'transparent'}}>{h}</th>)}</tr></thead>
        <tbody>{a.table.r.map((r,i)=><tr key={i}>{r.map((c,j)=>
          <td key={j} style={{padding:'6px 9px',fontSize:12}}>{c}</td>)}</tr>)}</tbody>
      </table></div>}
    {a.body2 && <p>{a.body2}</p>}
    {a.draft && <div className="ai-box"><pre style={{margin:0,font:'inherit',whiteSpace:'pre-wrap',fontSize:12.5}}>{a.draft}</pre></div>}
    {a.src && a.src.length>0 && <div className="ai-src">
      {a.src.map((s,i)=><button key={i} onClick={()=>go(s.page,s.ref)}><I n="link" s={11}/>{s.l}</button>)}
    </div>}
    {a.note && <div className="ai-note">{a.note}</div>}
  </div>;
}

        {tiers.map(t=><button key={t} className={'btn sm '+(tier===t?'':'gho')} onClick={()=>setTier(t)}
          style={tier===t?{borderColor:'var(--brand-line)',background:'var(--brand-wash)',color:'var(--brand-700)'}:null}>
          {t==='all'?'Tất cả':t}</button>)}

    <div className="card">

              <td className="t-meta">{x.cat}</td>
              <td>{x.tier==='Key Tier-1'? <Chip k="brand">{x.tier}</Chip>

function TenderDetail({t, role}) {
  if (!t.bids.length) return <Empty icon="gavel" t="Chưa có hồ sơ dự thầu"
    s={'Gói thầu đang ở trạng thái "'+t.status+'". Bảng so sánh sẽ hiện khi có ít nhất một hồ sơ hợp lệ.'}/>;
  const scored = t.bids.map(b=>({...b, total: b.s.reduce((a,x,i)=>a+x*t.criteria[i].w/100,0)}))
                       .sort((a,b)=>b.total-a.total);
  const best = scored[0], cheapest = [...t.bids].sort((a,b)=>a.price-b.price)[0];
  return <React.Fragment>
    <SectionBar t="Bảng so sánh đa tiêu chí"/>
    <div style={{overflowX:'auto',border:'1px solid var(--line)',borderRadius:'var(--r)',marginBottom:14}}>
      <table style={{minWidth:460}}>
        <thead><tr>
          <th>Tiêu chí</th><th style={{textAlign:'right',width:54}}>Trọng số</th>
          {scored.map(b=><th key={b.v} style={{textAlign:'right',minWidth:92}}>{b.name}</th>)}
        </tr></thead>
        <tbody>

          {role.price && <tr>
            <td style={{fontWeight:450}}>Giá chào</td><td/>
            {scored.map(b=><td key={b.v} className="num"

      <p className="t-body" style={{fontSize:12.5,margin:0}}>
        {cheapest.name} chào {String(cheapest.price).replace('.',',')} tỷ, thấp hơn {best.name} khoảng{' '}
        {Math.round((best.price-cheapest.price)/best.price*100)}%. Chênh lệch điểm tổng là{' '}
        {(best.total - scored.find(x=>x.v===cheapest.v).total).toFixed(1).replace('.',',')} điểm,
        chủ yếu ở nhóm tiêu chí tuân thủ và môi trường — xã hội.
      </p>
    </div>}

    <SectionBar t="Nhận xét từng hồ sơ"/>
    {scored.map((b,i)=>
      <div key={b.v} style={{border:'1px solid var(--line)',borderRadius:'var(--r)',padding:'11px 13px',marginBottom:9,
        borderLeft:i===0?'2px solid var(--brand)':'1px solid var(--line)'}}>
        <div style={{display:'flex',gap:9,alignItems:'center',marginBottom:5,flexWrap:'wrap'}}>
          <span style={{fontSize:13.5,fontWeight:600}}>{b.name}</span>
          <span className="t-code" style={{color:'var(--ink-soft)'}}>{b.v}</span>
          {i===0 && <Chip k="brand">Điểm tổng cao nhất</Chip>}
          {b.won && <Chip k="ok">Đã phê duyệt</Chip>}
          {b.gap && <Chip k="warn" sh="tri">{b.gap}</Chip>}
        </div>
        <p className="t-body" style={{fontSize:12.5,margin:0}}>{b.note}</p>
      </div>)}
    <div className="ai-note" style={{marginTop:12}}>
      Điểm số do hội đồng đánh giá nhập trên hệ thống. Việc lựa chọn phải xem xét tổng thể mức độ phù hợp,
      không chỉ dựa trên giá chào thấp nhất (quy trình 2.1, bước 5).

/* ══ PR/PO & GIAO HÀNG ══════════════════════════════════════ */
function PagePO({role, sel, setSel, go}) {

    (f==='all' || (f==='risk'&&p.risk==='risk') || (f==='open'&&p.status!=='Đã nhập kho')) &&

      {role.id==='plant' && <Chip k="brand"><I n="plant" s={12}/>Giới hạn nhà máy MCH-BD</Chip>}

    <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
      <div style={{display:'flex',gap:3}}>
        {[['all','Tất cả',scoped.length],['risk','Rủi ro trễ',scoped.filter(x=>x.risk==='risk').length],
          ['open','Chưa nhập kho',scoped.filter(x=>x.status!=='Đã nhập kho').length]].map(([k,l,n])=>
          <button key={k} className={'btn sm '+(f===k?'':'gho')} onClick={()=>setF(k)}
            style={f===k?{borderColor:'var(--brand-line)',background:'var(--brand-wash)',color:'var(--brand-700)'}:null}>

      </div>
      {role.id!=='plant' && <select value={plant} onChange={e=>setPlant(e.target.value)}

        {plants.map(x=><option key={x} value={x}>{x==='all'?'Mọi nhà máy':x}</option>)}

        {role.price && <label style={{display:'flex',alignItems:'center',gap:5}}>
          <I n="coin" s={14} c="var(--ink-soft)"/>
          <span className="t-meta">Loại tiền</span>
          <select value={cur} onChange={e=>setCur(e.target.value)}
            style={{height:27,border:'1px solid var(--line)',borderRadius:'var(--r)',padding:'0 6px',
              background:'var(--surface)',fontSize:12.5}}>
            <option>VND</option><option>USD</option></select>

        <span className="t-meta">{list.length} đơn hàng</span>
      </div>
    </div>

    <div className="card">
      {picked.length>0 && <div className="bulk">
        <Check on={true}/>
        <span style={{flex:1}}>Đã chọn <strong>{picked.length}</strong> đơn hàng</span>
        <button className="btn sm" onClick={()=>window.__act({kind:'action',
          title:'Gửi nhắc giao hàng hàng loạt ('+picked.length+' PO)',ref:picked.join(', '),page:'po',
          role:role.name,toast:'Đã ghi việc nhắc '+picked.length+' đơn hàng'})}>Nhắc giao hàng</button>
        <button className="btn gho sm" onClick={()=>setPicked([])}>Bỏ chọn</button>

      {list.length===0 ? <Empty icon="truck" t="Không có đơn hàng khớp bộ lọc" s="Đổi bộ lọc hoặc chọn nhà máy khác."/>
      : <table>
        <thead><tr>
          <th style={{width:34}}><button onClick={()=>setPicked(picked.length===list.length?[]:list.map(x=>x.code))}
            aria-label="Chọn tất cả"><Check on={picked.length>0&&picked.length===list.length}/></button></th>
          <th>Số PO</th><th>Nhà cung cấp</th><th>Vật tư</th><th>Nhà máy</th>
          <th style={{textAlign:'right'}}>Số lượng</th>
          {role.price && <th style={{textAlign:'right'}}>Giá trị ({cur})</th>}

        <tbody>{list.map(x=>{ const st=poStep(x); const on=picked.includes(x.code);
          return <tr key={x.code} data-click className={sel===x.code?'sel':''} onClick={()=>setSel(x.code)}>

              setPicked(p=>on?p.filter(c=>c!==x.code):[...p,x.code]);}}><Check on={on}/></td>

            <td className="t-meta" style={{maxWidth:180}}>{x.mat}</td>

            {role.price && <td className="num">{cur==='USD'

              : String(x.value).replace('.',',')}</td>}
            <td className="t-code" style={{color:x.risk==='risk'?'var(--risk)':'inherit'}}>
              {x.promised.split('-').reverse().join('/')}
              {x.late>0 && <span style={{color:'var(--risk)'}}> +{x.late}n</span>}</td>
            <td><Chip k={sevChip(x.risk)} sh={x.risk==='risk'?'tri':x.risk==='warn'?'sq':''}>{x.status}</Chip></td>
            <td><Flow steps={PO_STEPS} at={st.at} bad={st.bad}/></td>
          </tr>;})}</tbody>
      </table>}
      </div>
    </div>

    <Drawer open={!!p} onClose={()=>setSel(null)} title={p&&p.mat} sub={p&&(p.vn+' · '+p.plant+' · '+p.qty)}
      chips={p && [<span key="c" className="t-code" style={{alignSelf:'center',color:'var(--ink-soft)'}}>{p.code}</span>,
                   <Chip key="s" k={sevChip(p.risk)} sh={p.risk==='risk'?'tri':''}>{p.status}</Chip>]}
      footer={p && <React.Fragment>
        <button className="btn sm" onClick={()=>go('vendors', p.v)}>Mở hồ sơ NCC</button>
        <button className="btn sm" onClick={()=>window.__openAI('Tóm tắt tình trạng '+p.code+' và những việc cần theo dõi tiếp theo')}>
          <AIMark s={14}/> Hỏi trợ lý</button>
        <button className="btn pri sm" onClick={()=>{
          window.__act({kind:'action',title:'Soạn email nhắc giao hàng '+p.code,ref:p.code,page:'po',
            role:role.name,detail:p.vn+' — '+p.mat,toast:'Đã ghi việc vào nhật ký'});
          window.__openAI('Soạn email nhắc nhà cung cấp về '+p.code);}}>
          Soạn email nhắc</button>
      </React.Fragment>}>
      {p && <PODetail p={p} role={role} go={go}/>}
    </Drawer>
  </div>;
}

/* ══ ĐÁNH GIÁ & ESG ═════════════════════════════════════════ */
function PageScorecard({role, sel, setSel, go}) {
  const [tab, setTab] = useState('score');
  const s = getSCARS().find(x=>x.code===sel);
  useEffect(()=>{ if(sel) setTab('scar'); },[sel]);
  const ranked = getVENDORS().filter(v=>v.esg!=null).sort((a,b)=>b.esg-a.esg);
  return <div className="page">
    <div className="page-head"><div style={{flex:1,minWidth:260}}>

        Sustainable Supply Chain Guideline (quy trình 2.6).</p>
    </div></div>
    <div className="tabs">
      <button className={'tab '+(tab==='score'?'on':'')} onClick={()=>setTab('score')}>Scorecard</button>
      <button className={'tab '+(tab==='scar'?'on':'')} onClick={()=>setTab('scar')}>

    </div>

    {tab==='score' && <div className="card"><div className="tw">
      <table>
        <thead><tr><th>Nhà cung cấp</th><th>Tier</th><th style={{textAlign:'right'}}>OTIF</th>
          <th style={{textAlign:'right'}}>Chất lượng</th><th style={{width:160}}>Điểm ESG</th>
          <th>Hồ sơ mở</th></tr></thead>
        <tbody>{ranked.map(v=>{
          const qs = Math.max(0, 100 - v.ppm/20);
          return <tr key={v.code} data-click onClick={()=>go('vendors', v.code)}>
            <td><div style={{fontWeight:500}}>{v.name}</div>
                <div className="t-code" style={{color:'var(--ink-soft)'}}>{v.code}</div></td>
            <td>{v.tier==='Key Tier-1'? <Chip k="brand">{v.tier}</Chip> : <Chip>{v.tier}</Chip>}</td>
            <td className="num">{v.otif.toFixed(1).replace('.',',')}%</td>
            <td className="num">{qs.toFixed(0)}</td>
            <td><div style={{display:'flex',gap:9,alignItems:'center'}}>
              <span className="t-num" style={{width:26,fontSize:12.5,
                color:v.esg>=75?'var(--ok)':v.esg>=60?'var(--warn)':'var(--risk)'}}>{v.esg}</span>
              <div style={{flex:1}}><Meter v={v.esg} k={v.esg>=75?'ok':v.esg>=60?'warn':'risk'}/></div>
            </div></td>
            <td>{v.open.scar>0? <Chip k="risk" sh="tri">{v.open.scar} SCAR</Chip>

    {tab==='scar' && <div style={{display:'grid',gap:11}}>
      {getSCARS().map(x=>

/* ══════════════════════════════════════════════════════════════
   MÔ HÌNH HOÁ DỮ LIỆU
   Dạng biểu đồ do công việc của dữ liệu quyết định, không do thẩm mỹ:
   độ lớn → cột xếp hạng · thay đổi theo thời gian → đường ·
   quan hệ hai đại lượng → phân tán · tồn đọng theo bước → thanh giai đoạn ·
   đối chiếu nhiều tiêu chí → cột nhóm · cấu trúc dữ liệu → sơ đồ thực thể.
   Bảng màu phân loại dùng thứ tự cố định c1→c4, không xoay vòng.
   ══════════════════════════════════════════════════════════════ */

function useTip() {
  const [tip, setTip] = useState(null);
  const node = tip && <div style={{position:'fixed',left:tip.x,top:tip.y,transform:'translate(-50%,-100%)',
    background:'var(--ink)',color:'var(--canvas)',padding:'6px 9px',borderRadius:5,fontSize:12,
    pointerEvents:'none',zIndex:90,boxShadow:'var(--sh-pop)',whiteSpace:'nowrap',marginTop:-8}}>
    <div style={{fontWeight:600,marginBottom:1}}>{tip.t}</div>
    {tip.rows.map((r,i)=><div key={i} style={{opacity:.82,fontSize:11.5}}>{r}</div>)}
  </div>;
  return [node, setTip];
}
const fmt = n => String(n).replace('.', ',');
/* mốc trục tròn số thay vì chia đều ra số lẻ */
function niceTicks(min, max, want) {
  const span = max-min, raw = span/(want||3), p10 = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*p10).find(v=>v>=raw) || 10*p10;
  const out = []; for (let t=Math.ceil(min/step)*step; t<=max+1e-9; t+=step) out.push(Math.round(t*100)/100);
  return out.length>1 ? out : [min, max];
}

/* ── Cột xếp hạng: độ lớn giữa các hạng mục. Một chuỗi → một sắc độ, không cần chú giải ── */
function BarRanked({rows, unit, max}) {
  const [tip, setTip] = useTip();
  const top = max || Math.max.apply(null, rows.map(r=>r.v));
  return <div>
    {rows.map((r,i)=>
      <div key={i} style={{display:'flex',alignItems:'center',gap:11,padding:'5px 0'}}
        onMouseMove={e=>setTip({x:e.clientX,y:e.clientY,t:r.k,rows:[fmt(r.v)+' '+unit].concat(r.sub?[r.sub]:[])})}
        onMouseLeave={()=>setTip(null)}>
        <span style={{flex:'none',width:146,fontSize:12.5,color:'var(--ink-mid)',overflow:'hidden',
          textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.k}</span>
        <span style={{flex:1,minWidth:0,height:16,display:'flex',alignItems:'center'}}>
          <span style={{display:'block',height:13,width:Math.max(1.5,r.v/top*100)+'%',
            background:'var(--c1)',borderRadius:'2px 4px 4px 2px',transition:'width .25s'}}/>
        </span>
        <span className="t-num" style={{flex:'none',width:62,textAlign:'right',fontSize:12.5}}>
          {fmt(r.v)}</span>
      </div>)}
    {tip}
  </div>;
}

/* ── Đường: thay đổi theo thời gian. ≥2 chuỗi → luôn có chú giải + nhãn cuối đường ── */
function LineMulti({x, series, yMin, yMax, unit}) {
  const [tip, setTip] = useTip();
  const [hv, setHv] = useState(null);
  const W=560, H=210, L=38, R=104, T=12, B=26;
  const iw = W-L-R, ih = H-T-B;
  const px = i => L + (x.length<2?0:i/(x.length-1)*iw);
  const py = v => T + ih - (v-yMin)/(yMax-yMin)*ih;
  const ticks = niceTicks(yMin, yMax, 3);
  return <div style={{position:'relative'}}>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',maxWidth:'100%',overflow:'visible'}}
      onMouseLeave={()=>{setHv(null);setTip(null);}}>
      {ticks.map((t,i)=><g key={i}>
        <line x1={L} x2={L+iw} y1={py(t)} y2={py(t)} stroke="var(--line-soft)" strokeWidth="1"/>
        <text x={L-7} y={py(t)+3.5} textAnchor="end" fontSize="10" fill="var(--ink-soft)"
          fontFamily="var(--fm)">{fmt(t)}</text>
      </g>)}
      {x.map((lb,i)=><text key={i} x={px(i)} y={H-9} textAnchor="middle" fontSize="10"
        fill="var(--ink-soft)">{lb}</text>)}
      {hv!=null && <line x1={px(hv)} x2={px(hv)} y1={T} y2={T+ih} stroke="var(--line-strong)"
        strokeWidth="1" strokeDasharray="3 3"/>}
      {series.map((s,si)=><g key={s.n}>
        <path d={s.v.map((v,i)=>(i?'L':'M')+px(i)+' '+py(v)).join(' ')} fill="none"
          stroke={`var(--c${si+1})`} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
        {hv!=null && <circle cx={px(hv)} cy={py(s.v[hv])} r="4.5" fill={`var(--c${si+1})`}
          stroke="var(--surface)" strokeWidth="2"/>}
        <text x={L+iw+8} y={py(s.v[s.v.length-1])+3.5} fontSize="11" fill="var(--ink-mid)">{s.n}</text>
      </g>)}
      {x.map((lb,i)=><rect key={i} x={px(i)-iw/(x.length*2)} y={T} width={iw/x.length} height={ih}
        fill="transparent" style={{cursor:'crosshair'}}
        onMouseMove={e=>{ setHv(i); setTip({x:e.clientX,y:e.clientY,t:lb,
          rows:series.map(s=>s.n+': '+fmt(s.v[i])+unit)}); }}/>)}
    </svg>
    <Legend items={series.map((s,i)=>({n:s.n, c:`var(--c${i+1})`}))}/>
    {tip}
  </div>;
}

function Legend({items, shape}) {
  return <div style={{display:'flex',flexWrap:'wrap',gap:'6px 14px',marginTop:9}}>
    {items.map((it,i)=><span key={i} style={{display:'inline-flex',alignItems:'center',gap:6,
      fontSize:12,color:'var(--ink-mid)'}}>

        background:it.c,flex:'none'}}/>{it.n}</span>)}
  </div>;
}

/* ── Phân tán: quan hệ giữa hai đại lượng. Màu theo thực thể (Tier), không theo thứ hạng ── */
function Scatter({pts, xLab, yLab, groups}) {
  const [tip, setTip] = useTip();
  const W=560, H=230, L=52, R=14, T=14, B=34;
  const iw=W-L-R, ih=H-T-B;
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const x0=0, x1=Math.ceil(Math.max.apply(null,xs)/250)*250;
  const y0=Math.floor(Math.min.apply(null,ys)/10)*10, y1=Math.ceil(Math.max.apply(null,ys)/10)*10;
  const px=v=>L+(v-x0)/(x1-x0)*iw, py=v=>T+ih-(v-y0)/(y1-y0)*ih;
  const rr=v=>5+Math.sqrt(v)*1.5;
  return <div>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',overflow:'visible'}}>
      {niceTicks(y0,y1,3).map((t,i)=><g key={i}>
        <line x1={L} x2={L+iw} y1={py(t)} y2={py(t)} stroke="var(--line-soft)"/>
        <text x={L-7} y={py(t)+3.5} textAnchor="end" fontSize="10" fill="var(--ink-soft)"
          fontFamily="var(--fm)">{t}</text></g>)}
      {niceTicks(x0,x1,3).concat([x0]).map((t,i)=><text key={i} x={px(t)} y={H-16} textAnchor="middle" fontSize="10"
        fill="var(--ink-soft)" fontFamily="var(--fm)">{t}</text>)}
      <text x={L+iw/2} y={H-2} textAnchor="middle" fontSize="10.5" fill="var(--ink-soft)">{xLab}</text>
      <text x={13} y={T+ih/2} fontSize="10.5" fill="var(--ink-soft)"
        transform={`rotate(-90 13 ${T+ih/2})`} textAnchor="middle">{yLab}</text>
      {pts.map((p,i)=>
        <circle key={i} cx={px(p.x)} cy={py(p.y)} r={rr(p.r)} fill={`var(--c${groups.indexOf(p.g)+1})`}
          fillOpacity=".78" stroke="var(--surface)" strokeWidth="2" style={{cursor:'pointer'}}
          onMouseMove={e=>setTip({x:e.clientX,y:e.clientY,t:p.n,
            rows:[yLab+': '+fmt(p.y),xLab+': '+p.x,'Chi tiêu: '+fmt(p.r)+' tỷ',p.g]})}
          onMouseLeave={()=>setTip(null)}/>)}
      {pts.filter(p=>p.flag).map((p,i)=>
        <text key={i} x={px(p.x)} y={py(p.y)-rr(p.r)-5} textAnchor="middle" fontSize="10.5"
          fill="var(--ink)" fontWeight="600">{p.n}</text>)}
    </svg>
    <Legend shape="dot" items={groups.map((g,i)=>({n:g, c:`var(--c${i+1})`}))}/>
    {tip}
  </div>;
}

/* ── Thanh giai đoạn: tồn đọng ở bước nào. Nút thắt dùng màu trạng thái + nhãn, không chỉ màu ── */
function StageBars({stages}) {
  const [tip, setTip] = useTip();
  const top = Math.max.apply(null, stages.map(s=>s.n));
  return <div>
    {stages.map((s,i)=>
      <div key={i} style={{display:'flex',alignItems:'center',gap:11,padding:'6px 0',
        borderBottom:i<stages.length-1?'1px dashed var(--line-soft)':'none'}}
        onMouseMove={e=>setTip({x:e.clientX,y:e.clientY,t:s.k,rows:[s.n+' hồ sơ đang mở', s.note]})}
        onMouseLeave={()=>setTip(null)}>
        <span className="t-code" style={{flex:'none',width:26,color:'var(--ink-soft)'}}>{s.step}</span>
        <span style={{flex:'none',width:134,fontSize:12.5,color:'var(--ink-mid)'}}>{s.k}</span>
        <span style={{flex:1,minWidth:0,display:'flex',alignItems:'center',gap:8}}>
          <span style={{display:'block',height:13,width:Math.max(2,s.n/top*78)+'%',borderRadius:'2px 4px 4px 2px',
            background: s.bottleneck? 'var(--warn)' : 'var(--c1)'}}/>
          {s.bottleneck && <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11,
            color:'var(--warn)',fontWeight:600,whiteSpace:'nowrap'}}>
            <I n="alert" s={11}/>Nút thắt</span>}
        </span>
        <span className="t-num" style={{flex:'none',width:34,textAlign:'right',fontSize:12.5}}>{s.n}</span>
      </div>)}
    {tip}
  </div>;
}

/* ── Cột nhóm: đối chiếu cùng tiêu chí giữa các hồ sơ ── */
function GroupedBar({cats, series, unit}) {
  const [tip, setTip] = useTip();
  const W=560, H=206, L=36, R=10, T=10, B=44;
  const iw=W-L-R, ih=H-T-B;
  const gw = iw/cats.length, bw = Math.min(17,(gw-10)/series.length);
  return <div>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',overflow:'visible'}}>
      {[0,50,100].map((t,i)=><g key={i}>
        <line x1={L} x2={L+iw} y1={T+ih-t/100*ih} y2={T+ih-t/100*ih} stroke="var(--line-soft)"/>
        <text x={L-7} y={T+ih-t/100*ih+3.5} textAnchor="end" fontSize="10" fill="var(--ink-soft)"
          fontFamily="var(--fm)">{t}</text></g>)}
      {cats.map((c,ci)=>
        <g key={ci}>
          {series.map((s,si)=>{
            const h = s.v[ci]/100*ih;
            const x = L+ci*gw+(gw-bw*series.length-2*(series.length-1))/2+si*(bw+2);
            return <rect key={si} x={x} y={T+ih-h} width={bw} height={h} rx="3"
              fill={`var(--c${si+1})`} style={{cursor:'pointer'}}
              onMouseMove={e=>setTip({x:e.clientX,y:e.clientY,t:c,rows:[s.n+': '+s.v[ci]+unit]})}
              onMouseLeave={()=>setTip(null)}/>;})}
          <text x={L+ci*gw+gw/2} y={T+ih+14} textAnchor="middle" fontSize="9.5" fill="var(--ink-soft)">
            {c.split(' ').slice(0,2).join(' ')}</text>
          <text x={L+ci*gw+gw/2} y={T+ih+25} textAnchor="middle" fontSize="9.5" fill="var(--ink-soft)">
            {c.split(' ').slice(2).join(' ')}</text>
        </g>)}
    </svg>
    <Legend items={series.map((s,i)=>({n:s.n, c:`var(--c${i+1})`}))}/>
    {tip}
  </div>;
}

const PO_STEPS = ['PR được duyệt','PO phát hành','NCC xác nhận','Giao hàng','Tiếp nhận & IQC'];
function poStep(p) {
  const m = { 'Chờ NCC xác nhận':1, 'NCC đã xác nhận':2, 'Đang vận chuyển':3,
              'Trễ giao':3, 'Chờ kết luận IQC':4, 'Đã nhập kho':5 };
  const at = m[p.status] !== undefined ? m[p.status] : 2;
  return { at, bad: p.risk==='risk' };
}
const TD_STEPS = ['Phát hành','Nhận hồ sơ','Đánh giá','Phê duyệt'];
function tdStep(t) {
  const m = { 'Chuẩn bị phát hành':0, 'Đang nhận hồ sơ':1, 'Đang đánh giá':2,
              'Chờ phê duyệt kết quả':3, 'Đã phê duyệt kết quả':4 };
  const at = m[t.status] !== undefined ? m[t.status] : 1;
  return { at, bad: !!t.overdue };
}

const ERD_R = [
  ['sup','cert','1','n'], ['sup','tier','1','n'], ['ten','bid','1','n'], ['sup','bid','1','n'],
  ['sup','ct','1','n'], ['pr','po','1','n'], ['ct','po','1','n'], ['po','asn','1','n'],
  ['asn','lot','1','n'], ['lot','iqc','1','n'], ['lot','ncr','1','n'], ['sup','sc','1','n'],
];
function ERD() {
  const [sel, setSel] = useState(null);
  const by = id => ERD_E.find(e=>e.id===id);
  const hh = e => 26 + e.f.length*13 + 7;
  const path = (a,b) => {
    const A=by(a), B=by(b), ah=hh(A), bh=hh(B);
    if (Math.abs(A.x-B.x) < 10) {           // cùng cột → nối dọc
      const x=A.x+A.w/2;
      return `M${x} ${A.y+ah} L${x} ${B.y}`;
    }
    const [l,r] = A.x<B.x ? [A,B] : [B,A];
    const lh = A.x<B.x?ah:bh, rh = A.x<B.x?bh:ah;
    const x1=l.x+l.w, y1=l.y+lh/2, x2=r.x, y2=r.y+rh/2, mx=(x1+x2)/2;
    return `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
  };
  const lit = id => sel && (sel===id || ERD_R.some(([a,b])=>(a===sel&&b===id)||(b===sel&&a===id)));
  return <div>
    <div style={{overflowX:'auto',border:'1px solid var(--line)',borderRadius:'var(--r)',
                 background:'var(--surface-2)',padding:'10px 0'}}>
      <svg viewBox="0 0 948 360" style={{width:'100%',minWidth:760,height:'auto'}}>
        {ERD_R.map(([a,b,ca,cb],i)=>{
          const on = !sel || lit(a)&&lit(b);
          return <g key={i} opacity={on?1:.17}>
            <path d={path(a,b)} fill="none" stroke={sel&&on?'var(--brand)':'var(--line-strong)'}
              strokeWidth={sel&&on?1.6:1.2}/>
          </g>;})}
        {ERD_E.map(e=>{
          const h = hh(e), on = !sel || lit(e.id), isSel = sel===e.id;
          return <g key={e.id} opacity={on?1:.25} style={{cursor:'pointer'}}
            onClick={()=>setSel(s=>s===e.id?null:e.id)}>
            <rect x={e.x} y={e.y} width={e.w} height={h} rx="5" fill="var(--surface)"
              stroke={isSel?'var(--brand)':'var(--line-strong)'} strokeWidth={isSel?1.8:1}/>
            <rect x={e.x} y={e.y} width={e.w} height="21" rx="5" fill={isSel?'var(--brand-wash)':'var(--surface-sunk)'}/>
            <rect x={e.x} y={e.y+14} width={e.w} height="7" fill={isSel?'var(--brand-wash)':'var(--surface-sunk)'}/>
            <text x={e.x+8} y={e.y+14.5} fontSize="11" fontWeight="600"
              fill={isSel?'var(--brand-700)':'var(--ink)'}>{e.t}</text>
            {e.f.map((f,i)=><text key={i} x={e.x+8} y={e.y+34+i*13} fontSize="9.5"
              fontFamily="var(--fm)" fill="var(--ink-soft)">{f}</text>)}
          </g>;})}
      </svg>
    </div>
    <div style={{display:'flex',gap:10,alignItems:'center',marginTop:10,flexWrap:'wrap'}}>
      <span className="t-meta">
        {sel? <React.Fragment>Đang xem <strong style={{color:'var(--ink)'}}>{by(sel).t}</strong> — {by(sel).d}.
          Bấm lần nữa để bỏ chọn.</React.Fragment>
            : 'Bấm vào một thực thể để làm nổi các quan hệ của nó. Quan hệ đều là 1–n theo chiều mũi từ khoá chính sang khoá ngoại.'}
      </span>
    </div>
  </div>;
}

function qSpend(role) {
  const rows = VENDORS.filter(v=>v.spend>0).sort((a,b)=>b.spend-a.spend)
    .map(v=>({k:v.name, v:v.spend, sub:v.tier}));
  return { form:'Cột xếp hạng', why:'Câu hỏi về độ lớn giữa các hạng mục rời rạc. Cột ngang cho phép đọc tên dài và so sánh chiều dài, chính xác hơn hình tròn chia lát.',
    locked: !role.price, lockNote:'Vai trò của bạn không được xem dữ liệu chi tiêu.',
    node: <BarRanked rows={rows} unit="tỷ đồng"/>,
    table:{ h:['Nhà cung cấp','Chi tiêu (tỷ)','Tier'], r: rows.map(r=>[r.k, fmt(r.v), r.sub]) } };
}
function qOtif() {
  const g = { 'Key Tier-1':[], 'Tier-1':[], 'Tier-2':[] };
  VENDORS.forEach(v=>{ if(v.deliv.length && g[v.tier]) g[v.tier].push(v.deliv.map(d=>d.v)); });
  const series = Object.keys(g).filter(k=>g[k].length).map(k=>({ n:k,
    v: g[k][0].map((_,i)=> Math.round(g[k].reduce((a,arr)=>a+arr[i],0)/g[k].length*10)/10) }));
  const x = ['T5','T6','T7','T8','T9','T10'];
  return { form:'Biểu đồ đường', why:'Câu hỏi về thay đổi theo thời gian. Đường thể hiện xu hướng liên tục; mỗi nhóm Tier là một chuỗi riêng trên cùng một trục, không dùng hai trục.',
    node: <LineMulti x={x} series={series} yMin={75} yMax={100} unit="%"/>,
    table:{ h:['Nhóm'].concat(x), r: series.map(s=>[s.n].concat(s.v.map(v=>fmt(v)+'%'))) } };
}
function qRisk(role) {
  const groups = ['Key Tier-1','Tier-1','Tier-2'];
  const pts = VENDORS.filter(v=>v.otif!=null).map(v=>({
    n:v.name.split(' ').slice(-2).join(' '), x:v.ppm, y:v.otif, r:v.spend, g:v.tier,
    flag: v.ppm>900 || v.otif<82 }));
  return { form:'Biểu đồ phân tán', why:'Câu hỏi về quan hệ giữa hai đại lượng liên tục. Vị trí thể hiện hai trục, kích thước điểm thể hiện quy mô chi tiêu, màu theo Tier — màu gắn với thực thể, không theo thứ hạng.',
    node: <Scatter pts={pts} groups={groups} xLab="Tỷ lệ lỗi (ppm) →" yLab="OTIF (%) →"/>,
    table:{ h:['Nhà cung cấp','OTIF','ppm','Chi tiêu (tỷ)','Tier'],
      r: VENDORS.filter(v=>v.otif!=null).map(v=>[v.name, fmt(v.otif)+'%', String(v.ppm),
        role.price? fmt(v.spend):'—', v.tier]) } };
}
function qStage() {
  const stages = CHAIN.map(c=>({ step:c.n, k:c.t, n:c.count, note:c.note, bottleneck:c.count>=20||c.hot>=3 }));

function qBids() {

function AIChart({spec}) {
  if (spec.kind==='bar') return <div className="ai-box" style={{paddingTop:11}}>
    <div style={{fontSize:11,fontWeight:600,letterSpacing:'.04em',textTransform:'uppercase',
      color:'var(--ink-soft)',marginBottom:8}}>{spec.title}</div>
    <BarRanked rows={spec.rows} unit={spec.unit}/>
  </div>;
  if (spec.kind==='line') return <div className="ai-box" style={{paddingTop:11}}>
    <div style={{fontSize:11,fontWeight:600,letterSpacing:'.04em',textTransform:'uppercase',
      color:'var(--ink-soft)',marginBottom:8}}>{spec.title}</div>
    <LineMulti x={spec.x} series={spec.series} yMin={spec.yMin} yMax={spec.yMax} unit={spec.unit}/>
  </div>;
  return null;
}

/* ── trích thực thể ── */
function findCode(q) {
  const m = String(q).toUpperCase().match(/\b(?:PO|GT|NCC|LOT|SCAR|NCR|PR|GRN|NDA)-[0-9A-Z-]+|HĐ-[0-9-]+/);
  return m ? m[0] : null;
}
function lookup(code) {
  if (!code) return null;
  const c = code.toUpperCase();
  const v = getVENDORS().find(x=>x.code===c); if (v) return {t:'vendor', d:v};
  const t = getTENDERS().find(x=>x.code===c); if (t) return {t:'tender', d:t};
  const p = getPOS().find(x=>x.code===c);     if (p) return {t:'po', d:p};
  const l = getLOTS().find(x=>x.lot===c);     if (l) return {t:'lot', d:l};
  const s = getSCARS().find(x=>x.code===c);   if (s) return {t:'scar', d:s};
  const k = getCONTRACTS().find(x=>x.code===c); if (k) return {t:'contract', d:k};
  return null;
}
function findVendor(q) {
  const n = strip(q);
  return getVENDORS().find(v => {
    const full = strip(v.name);
    if (n.includes(full)) return true;
    const key = full.replace(/^(ctcp|cong ty|cong ty tnhh|cong ty cp|htx)\s+/,'');
    return key.length>5 && n.includes(key);
  }) || null;
}
const vn = n => String(Math.round(n*100)/100).replace('.',',');

/* ── các câu trả lời dựng sẵn cho từng thực thể ── */
function sumVendor(v, role) {
  const bad = v.certs.filter(c=>c.st!=='ok');
  return { title: v.name,
    body:[`${v.cat} · ${v.tier} · hợp tác từ ${v.since}${v.plants.length?' · cung ứng cho '+v.plants.join(', '):''}. Trạng thái hồ sơ: ${v.status}.`],
    list:[ {t:'OTIF 12 tháng', s: v.otif!=null? vn(v.otif)+'%':'chưa có'},
           {t:'Tỷ lệ lỗi', s: v.ppm!=null? v.ppm+' ppm':'chưa có'},
           {t:'Điểm ESG', s: v.esg!=null? v.esg+'/100':'chưa đánh giá'},
           role.price? {t:'Chi tiêu 12 tháng', s: v.spend? vn(v.spend)+' tỷ ('+vn(v.share)+'% nhóm hàng)':'—'} : null,
           {t:'Hồ sơ đang mở', s:`${v.open.po} PO · ${v.open.ncr} NCR · ${v.open.scar} SCAR`},
           bad.length? {t:'Tài liệu cần xử lý', s: bad.map(c=>c.n).join(', ')} : {t:'Chứng nhận', s:'đầy đủ'},
         ].filter(Boolean),
    body2: v.tierScore.length
      ? `Điểm phân loại Tier: ${v.tierScore.reduce((a,x)=>a+x.v,0)}/25. Tiêu chí cao nhất là "${v.tierScore.slice().sort((a,b)=>b.v-a.v)[0].k}".`
      : 'Nhà cung cấp chưa đủ dữ liệu giao dịch để chấm 5 tiêu chí phân loại Tier.',
    note:'Số liệu lấy từ hồ sơ nhà cung cấp và dữ liệu giao dịch 12 tháng gần nhất.',
    src:[{l:v.code, page:'vendors', ref:v.code}] };
}
function sumPO(p, role) {
  const done = p.tl.filter(e=>e.st==='done').length;
  return { title: p.code,
    body:[`${p.mat} — ${p.vn}, giao về ${p.plant}. Số lượng ${p.qty}${role.price?', giá trị '+vn(p.value)+' tỷ':''}. Trạng thái: **${p.status}**.`],
    list:[ {t:'Ngày giao cam kết', s:p.promised.split('-').reverse().join('/')},
           p.late? {t:'Số ngày trễ', s:p.late+' ngày'} : null,
           {t:'Tiến độ quy trình', s:`${done}/${p.tl.length} bước đã xong`} ].filter(Boolean),
    body2: p.reason || 'Chưa ghi nhận vấn đề nào với đơn hàng này.',
    note:'Nguyên nhân chậm là nội dung do người dùng hoặc nhà cung cấp ghi nhận, không phải suy luận.',
    src:[{l:p.code, page:'po', ref:p.code}, {l:p.v, page:'vendors', ref:p.v}] };
}
function sumTender(t, role) {
  if (!t.bids.length) return { title:t.code,
    body:[`${t.title}. Trạng thái: ${t.status}, hạn ${t.due.split('-').reverse().join('/')}. Chưa có hồ sơ dự thầu nào được nộp.`],
    note:'Tôi chỉ tổng hợp trên hồ sơ đã nộp, không suy đoán về nhà cung cấp chưa tham gia.',
    src:[{l:t.code, page:'bidding', ref:t.code}] };
  const sc = t.bids.map(b=>({b, total:b.s.reduce((a,x,i)=>a+x*t.criteria[i].w/100,0)})).sort((a,b)=>b.total-a.total);
  return { title:'So sánh hồ sơ — '+t.code,
    body:[`${t.title}. ${t.bids.length} hồ sơ, chấm theo ${t.criteria.length} nhóm tiêu chí có trọng số xác định trước khi mở thầu.`],
    table:{ h:['Nhà cung cấp','Điểm tổng', role.price?'Giá chào':'Giá','Điểm yếu'],
      r: sc.map(x=>[x.b.name, vn(x.total), role.price? vn(x.b.price)+' tỷ':'—', x.b.gap||'—']) },
    body2:`Chênh lệch giữa hồ sơ dẫn đầu và hồ sơ kế tiếp là ${vn(sc[0].total-sc[1].total)} điểm.`,
    note:'Điểm do hội đồng đánh giá nhập. Tôi không tự chấm và không đề xuất bên trúng thầu.',
    src:[{l:t.code, page:'bidding', ref:t.code}] };
}
function sumLot(l) {
  const fail = l.tests.filter(t=>!t.ok);
  return { title:'Kết quả IQC — '+l.lot,
    body:[`${l.mat} từ ${l.vn}, thuộc ${l.po}, tiếp nhận ${l.recv.split('-').reverse().join('/')} tại ${l.plant}. Kết luận: **${l.res}**.`],
    table:{ h:['Chỉ tiêu','Đặc tả','Kết quả'], r:l.tests.map(t=>[t.k, t.spec, t.val+(t.ok?'':'  ✕')]) },
    body2: fail.length? `${fail.length} chỉ tiêu không đạt: ${fail.map(f=>f.k).join(', ')}.` : 'Toàn bộ chỉ tiêu đạt đặc tả.',
    note: l.ncr? 'Đã phát hành '+l.ncr+(l.scar? ' và '+l.scar:'')+'.' : 'Chưa phát sinh NCR cho lô này.',
    src:[{l:l.lot, page:'quality', ref:l.lot}, {l:l.po, page:'po', ref:l.po}] };
}
function sumScar(s) {
  return { title:s.code,
    body:[`${s.vn}, lô ${s.lot}. Phát hành ${s.issued.split('-').reverse().join('/')}, hạn phản hồi ${s.due.split('-').reverse().join('/')}. Trạng thái: **${s.st}**.`, s.issue],
    list:s.capa.map(c=>({t:c.s, s:c.st})),
    note:'Việc chấp nhận hay từ chối CAPA thuộc thẩm quyền QA/SQE.',

function sumContract(c, role) {
  return { title:c.code,
    body:[`${c.type} với ${c.vn}, phiên bản ${c.ver}. Hiệu lực ${c.eff.split('-').reverse().join('/')} đến ${c.exp.split('-').reverse().join('/')}. Trạng thái: **${c.st}**.`],
    list:c.terms.map(t=>({t})),
    note:'Tóm tắt dựa trên phiên bản đang lưu; khi rà soát pháp lý cần đối chiếu bản ký gốc.',
    src:[{l:c.code, page:'contracts', ref:c.code}] };
