/* ── bộ trả lời ── */
function localAnswer(q, page, role, ctx, mem) {
  const n = strip(q);
  const can = role.price;
  const V = getVENDORS(), P = getPOS(), T = getTENDERS(), L = getLOTS(), S = getSCARS(), C = getCONTRACTS();
  const deny = what => ({ title:'Ngoài phạm vi quyền',
    body:[`Vai trò ${role.name} không được cấp quyền xem ${what}. Tôi kế thừa đúng quyền của bạn nên không trả lời phần này được.`],
    note:'Giới hạn kiểm soát: '+role.limit, src:[] });

  // 1. phê duyệt — luôn từ chối
  if (/\b(phe duyet|duyet giup|duyet ho|chap thuan|approve)\b/.test(n))
    return { title:'Việc này không làm qua hội thoại',
      body:['Tôi không có thẩm quyền phê duyệt nhà cung cấp, gói thầu, hợp đồng hay PO. Phê duyệt phải thực hiện trên màn hình nghiệp vụ, qua quy trình có ghi nhật ký kiểm toán.',
            'Tôi giúp được phần chuẩn bị: tóm tắt hồ sơ, đối chiếu tiêu chí, soạn nháp nội dung trình duyệt.'],
      note:'Nguyên tắc này áp dụng cho mọi vai trò, kể cả vai trò có quyền phê duyệt.', src:[] };

  // 2. chào hỏi, giao tiếp cơ bản
  if (/^(chao|hi|hello|hey|alo|yo)\b/.test(n) || /^(ban|may|m|trolly|tro ly) (la ai|ten gi)/.test(n))
    return { title:'Xin chào',
      body:[`Tôi là trợ lý của MPO Purchase Platform. Bạn đang ở vai trò **${role.name}**, phạm vi dữ liệu: ${role.scope.toLowerCase()}.`,
            'Tôi tra cứu hồ sơ, phân tích và so sánh dữ liệu, giải thích khái niệm nghiệp vụ, vẽ biểu đồ và soạn nháp văn bản — trong đúng phạm vi quyền của bạn.'],
      list:[{t:'Thử hỏi: "PO nào đang trễ?"'},{t:'Thử hỏi: "OTIF là gì?"'},
            {t:'Thử hỏi: "So sánh hồ sơ dự thầu GT-2026-041"'},{t:'Thử hỏi: "Nhà cung cấp nào chi tiêu lớn nhất?"'}],
      src:[] };
  if (/^(cam on|thanks|thank you|ok|oke|okay|uhm|um|duoc roi|tot)\b/.test(n) && n.length < 24)
    return { title:'Sẵn sàng', body:['Bạn cần gì thêm thì hỏi tiếp nhé.'], src:[] };
  if (/\b(lam duoc gi|giup duoc gi|co the lam gi|chuc nang gi)\b/.test(n))
    return { title:'Tôi làm được những việc này',
      body:['Trong phạm vi quyền của bạn:'],
      list:[{t:'Tra cứu hồ sơ theo mã', s:'PO-26-10-0471, GT-2026-041, NCC-0412…'},
            {t:'Lọc và xếp hạng danh sách', s:'PO trễ, chứng nhận sắp hết hạn, NCC theo OTIF'},
            {t:'Tính toán và so sánh', s:'tổng chi tiêu, OTIF trung bình, chênh lệch điểm thầu'},
            {t:'Giải thích khái niệm', s:'OTIF, Tier, SCAR, CAPA, RBAC, ABAC, SoD, DOA…'},
            {t:'Vẽ biểu đồ', s:'"vẽ biểu đồ OTIF 6 tháng"'},
            {t:'Soạn nháp email', s:'nhắc giao hàng, nhắc phản hồi CAPA'}],
      note:'Tôi không phê duyệt và không gửi email thay bạn.', src:[] };

  // 3. giải thích khái niệm
  for (const k in GLOSSARY) {
    const re = new RegExp('\\b'+k+'\\b');
    if (re.test(n) && /\b(la gi|nghia la|giai thich|hieu the nao|the nao la|dinh nghia)\b/.test(n)) {
      const g = GLOSSARY[k];
      return { title:g[0], body:g.slice(1), note:'Giải thích theo cách dùng trong hệ thống này.', src:[] };
    }
  }

  // 4. hồ sơ cụ thể theo mã, hoặc theo tên nhà cung cấp, hoặc hồ sơ đang mở
  const code = findCode(q);
  let hit = lookup(code);
  if (!hit && mem && mem.code && /\b(no|cai do|cai nay|ho so nay|don nay|lo nay|vay con|the con)\b/.test(n)) hit = lookup(mem.code);
  if (!hit) { const v = findVendor(q); if (v) hit = {t:'vendor', d:v}; }
  if (!hit && ctx) {
    if (ctx.vendor) hit={t:'vendor',d:ctx.vendor}; else if (ctx.po) hit={t:'po',d:ctx.po};
    else if (ctx.tender) hit={t:'tender',d:ctx.tender}; else if (ctx.lot) hit={t:'lot',d:ctx.lot};
    else if (ctx.scar) hit={t:'scar',d:ctx.scar}; else if (ctx.contract) hit={t:'contract',d:ctx.contract};
    if (hit && !/\b(nay|do|hien tai|dang mo|ho so|don hang|goi thau|lo|hop dong|tom tat|tinh trang|sao|the nao|gi)\b/.test(n)) hit=null;
  }
  if (hit) {
    if (code) { if (mem) mem.code = code; }
    else if (mem) mem.code = hit.d.code || hit.d.lot;
    if (/\b(soan|email|nhac|draft|thu)\b/.test(n) && hit.t==='po') return draftEmail(hit.d);
    if (hit.t==='vendor')   return sumVendor(hit.d, role);
    if (hit.t==='po')       return sumPO(hit.d, role);
    if (hit.t==='tender')   return sumTender(hit.d, role);
    if (hit.t==='lot')      return sumLot(hit.d);
    if (hit.t==='scar')     return sumScar(hit.d);
    if (hit.t==='contract') return sumContract(hit.d, role);
  }

  // 5. soạn email
  if (/\b(soan|email|nhac nha cung cap|draft)\b/.test(n)) {
    const p = (ctx&&ctx.po) || P.find(x=>x.risk==='risk') || P[0];
    return draftEmail(p);
  }

  // 6. biểu đồ
  if (/\b(bieu do|ve|truc quan|chart|do thi)\b/.test(n)) {
    if (/\b(chi tieu|spend|phan bo|gia tri)\b/.test(n)) {
      if (!can) return deny('dữ liệu chi tiêu');
      const rows = V.filter(v=>v.spend>0).sort((a,b)=>b.spend-a.spend).map(v=>({k:v.name,v:v.spend,sub:v.tier}));
      const tot = rows.reduce((a,r)=>a+r.v,0);
      return { title:'Phân bổ chi tiêu 12 tháng',
        body:['Câu hỏi về độ lớn giữa các hạng mục rời rạc nên tôi dùng cột xếp hạng.'],
        chart:{kind:'bar', title:'Chi tiêu theo nhà cung cấp (tỷ đồng)', rows, unit:'tỷ đồng'},
        body2:`Hai nhà cung cấp dẫn đầu chiếm ${Math.round((rows[0].v+rows[1].v)/tot*100)}% tổng chi tiêu.`,
        src:[{l:'Mở trang Phân tích', page:'analytics', ref:''}] };
    }
    const g = {'Key Tier-1':[],'Tier-1':[],'Tier-2':[]};
    V.forEach(v=>{ if(v.deliv.length && g[v.tier]) g[v.tier].push(v.deliv.map(d=>d.v)); });
    const series = Object.keys(g).filter(k=>g[k].length).map(k=>({n:k,
      v:g[k][0].map((_,i)=>Math.round(g[k].reduce((a,arr)=>a+arr[i],0)/g[k].length*10)/10)}));
    return { title:'OTIF 6 tháng theo nhóm Tier',
      body:['Câu hỏi về thay đổi theo thời gian nên tôi dùng biểu đồ đường, mỗi nhóm Tier là một chuỗi trên cùng một trục.'],
      chart:{kind:'line', title:'OTIF (%) — T5 đến T10', x:['T5','T6','T7','T8','T9','T10'],
             series, yMin:75, yMax:100, unit:'%'},
      body2:'Nhóm Tier-2 nằm dưới mục tiêu nội bộ 95% trong cả sáu tháng.',
      src:[{l:'Mở trang Phân tích', page:'analytics', ref:''}] };
  }

  // 7. PO trễ / rủi ro
  if (/\b(tre|cham|delay|rui ro giao|qua han giao)\b/.test(n)) {
    const late = P.filter(p=>p.risk==='risk');
    if (!late.length) return { title:'Không có PO nào đang trễ',
      body:['Trong phạm vi dữ liệu của bạn, mọi đơn hàng đều trong hạn giao cam kết.'], src:[] };
    return { title:`${late.length} PO đang vượt ngày giao cam kết`,
      body:[`Tổng cộng ${late.reduce((a,p)=>a+p.late,0)} ngày trễ cộng dồn.`],
      table:{h:['PO','Nhà cung cấp','Trễ','Nguyên nhân'],
        r:late.map(p=>[p.code, p.vn, p.late+' ngày', (p.reason||'—').split(/[.;]/)[0]])},
      note:'Nguyên nhân là nội dung được ghi nhận trên hệ thống, không phải suy luận của tôi.',
      src:late.map(p=>({l:p.code, page:'po', ref:p.code})) };
  }

  // 8. chứng nhận
  if (/\b(chung nhan|certificate|het han|sap het|giay phep)\b/.test(n)) {
    const rows = [];
    V.forEach(v=>v.certs.forEach(c=>{ if(c.st!=='ok') rows.push([v.name, c.n, c.exp==='—'?'Chưa nộp':c.exp]); }));
    return { title:`${rows.length} chứng nhận cần theo dõi`,
      body:['Gồm chứng nhận hết hạn trong 60 ngày tới và chứng nhận chưa được nộp.'],
      table:{h:['Nhà cung cấp','Chứng nhận','Hết hạn'], r:rows},
      note:'Hệ thống không tự xác minh tính xác thực của chứng nhận.',
      src:[{l:'Danh mục NCC', page:'vendors', ref:''}] };
  }

  // 9. tính toán tổng hợp
  if (/\b(tong|trung binh|cao nhat|thap nhat|nhieu nhat|it nhat|xep hang|top|lon nhat|bao nhieu)\b/.test(n)) {
    if (/\b(chi tieu|spend|gia tri mua)\b/.test(n)) {
      if (!can) return deny('dữ liệu chi tiêu');
      const rows = V.filter(v=>v.spend>0).sort((a,b)=>b.spend-a.spend);
      const tot = rows.reduce((a,v)=>a+v.spend,0);
      return { title:'Chi tiêu 12 tháng',
        body:[`Tổng chi tiêu trong phạm vi của bạn là **${vn(tot)} tỷ đồng** trên ${rows.length} nhà cung cấp. Cao nhất là ${rows[0].name} với ${vn(rows[0].spend)} tỷ (${vn(rows[0].spend/tot*100)}%).`],
        table:{h:['Nhà cung cấp','Chi tiêu (tỷ)','Tỷ trọng'],
          r:rows.map(v=>[v.name, vn(v.spend), vn(v.spend/tot*100)+'%'])},
        src:[{l:'Mở trang Phân tích', page:'analytics', ref:''}] };
    }
    if (/\b(otif|giao hang|dung han)\b/.test(n)) {
      const w = V.filter(v=>v.otif!=null).sort((a,b)=>b.otif-a.otif);
      const avg = w.reduce((a,v)=>a+v.otif,0)/w.length;
      return { title:'OTIF theo nhà cung cấp',
        body:[`OTIF trung bình là **${vn(avg)}%**, dưới mục tiêu nội bộ 95%. Cao nhất ${w[0].name} (${vn(w[0].otif)}%), thấp nhất ${w[w.length-1].name} (${vn(w[w.length-1].otif)}%).`],
        table:{h:['Nhà cung cấp','OTIF','Tier'], r:w.map(v=>[v.name, vn(v.otif)+'%', v.tier])},
        src:[{l:'Mở trang Phân tích', page:'analytics', ref:''}] };
    }
    if (/\b(loi|ppm|chat luong)\b/.test(n)) {
      const w = V.filter(v=>v.ppm!=null).sort((a,b)=>b.ppm-a.ppm);
      return { title:'Tỷ lệ lỗi theo nhà cung cấp',
        body:[`Cao nhất là ${w[0].name} với **${w[0].ppm} ppm**, gấp ${vn(w[0].ppm/w[w.length-1].ppm)} lần nhà cung cấp tốt nhất (${w[w.length-1].name}, ${w[w.length-1].ppm} ppm).`],
        table:{h:['Nhà cung cấp','ppm','Tier'], r:w.map(v=>[v.name, String(v.ppm), v.tier])},
        note:'Dưới 500 ppm là tốt, trên 900 ppm cần theo dõi.',
        src:[{l:'Mở trang Phân tích', page:'analytics', ref:''}] };
    }
    if (/\b(esg|ben vung|tuan thu)\b/.test(n)) {
      const w = V.filter(v=>v.esg!=null).sort((a,b)=>b.esg-a.esg);
      const low = w.filter(v=>v.esg<70);
      return { title:'Điểm ESG theo nhà cung cấp',
        body:[`${low.length}/${w.length} nhà cung cấp dưới 70 điểm${low.length?': '+low.map(v=>v.name).join(', '):''}.`],
        table:{h:['Nhà cung cấp','ESG','Tier'], r:w.map(v=>[v.name, String(v.esg), v.tier])},
        src:[{l:'Đánh giá & ESG', page:'scorecard', ref:''}] };
    }
  }

  // 10. danh sách theo chủ đề
  if (/\b(scar|capa|khac phuc)\b/.test(n)) {
    const open = S.filter(s=>s.sev!=='ok');
    return { title:`${open.length} SCAR đang theo dõi`,
      body:[open.length? 'Các yêu cầu khắc phục chưa đóng:' : 'Không còn SCAR nào đang mở.'],
      table:open.length?{h:['Mã','Nhà cung cấp','Trạng thái','Hạn'],
        r:open.map(s=>[s.code, s.vn, s.st, s.due.split('-').reverse().join('/')])}:null,
      src:open.map(s=>({l:s.code, page:'scorecard', ref:s.code})) };
  }
  if (/\b(hop dong|nda|dieu khoan|hieu luc)\b/.test(n)) {
    const soon = C.filter(c=>c.sev!=='ok');
    return { title:`${soon.length} hợp đồng cần xử lý`,
      body:['Gồm hợp đồng sắp hết hiệu lực và hồ sơ đang chờ Pháp lý rà soát.'],
      table:{h:['Mã','Nhà cung cấp','Trạng thái','Hết hạn'],
        r:soon.map(c=>[c.code, c.vn, c.st, c.exp.split('-').reverse().join('/')])},
      src:soon.map(c=>({l:c.code, page:'contracts', ref:c.code})) };
  }
  if (/\b(lo hang|iqc|kiem tra|khong dat|chat luong)\b/.test(n)) {
    const bad = L.filter(l=>l.st!=='ok');
    return { title: bad.length? `${bad.length} lô cần xử lý` : 'Mọi lô đều đạt',
      body:[bad.length? 'Các lô chưa kết luận hoặc không đạt IQC:' : 'Không có lô nào đang chờ kết luận hay không đạt.'],
      table:bad.length?{h:['Mã lô','Nhà cung cấp','Vật tư','Kết luận'],
        r:bad.map(l=>[l.lot, l.vn, l.mat, l.res])}:null,
      src:bad.map(l=>({l:l.lot, page:'quality', ref:l.lot})) };
  }
  if (/\b(goi thau|dau thau|tender|du thau)\b/.test(n)) {
    const act = T.filter(t=>t.status!=='Đã phê duyệt kết quả');
    return { title:`${act.length} gói thầu đang xử lý`,
      body:[T.filter(t=>t.overdue).length? `${T.filter(t=>t.overdue).length} gói đã quá hạn đánh giá.` : 'Không có gói nào quá hạn đánh giá.'],
      table:{h:['Mã','Nội dung','Trạng thái','Hạn'],
        r:act.map(t=>[t.code, t.title, t.status, t.due.split('-').reverse().join('/')])},
      src:act.map(t=>({l:t.code, page:'bidding', ref:t.code})) };
  }
  if (/\b(tier|phan loai|key tier)\b/.test(n)) {
    const k = V.filter(v=>v.tier==='Key Tier-1');
    return { title:'Phân loại Tier hiện tại',
      body:[`${k.length} nhà cung cấp thuộc nhóm Key Tier-1, là nhóm được ưu tiên rà soát hồ sơ và đánh giá tại chỗ.`],
      table:{h:['Nhà cung cấp','Tier','OTIF','ESG'],
        r:V.filter(v=>v.otif!=null).map(v=>[v.name, v.tier, vn(v.otif)+'%', String(v.esg)])},
      src:k.map(v=>({l:v.code, page:'vendors', ref:v.code})) };
  }

  // 11. việc cần làm
  if (/\b(uu tien|hom nay|viec gi|can lam|to do|cong viec)\b/.test(n)) {
    const mine = TASKS.filter(t=>t.roles.includes(role.id));
    const risk = mine.filter(t=>t.pri==='risk');
    return { title:'Việc cần xử lý trong phạm vi của bạn',
      body:[`${mine.length} việc đang mở, trong đó **${risk.length} việc đã quá hạn**.`],
      list:mine.slice(0,5).map(t=>({t:t.t, s:t.sla})),
      note:'Sắp xếp theo mức quá hạn so với SLA, không theo giá trị giao dịch.',
      src:risk.slice(0,3).map(t=>({l:t.ref||'Việc #'+t.id, page:t.page, ref:t.ref})) };
  }

  // 12. kiến trúc / phân quyền
  if (/\b(kien truc|tang|layer|rbac|abac|phan quyen|quyen han)\b/.test(n))
    return { title:'Kiến trúc và phân quyền',
      body:['Hệ thống có ba tầng: **Presentation Layer** (Purchase Portal, Supplier Portal, ứng dụng di động, Chat Widget), **Business Layer** (API Services, điều phối & chính sách, 8 mô-đun nghiệp vụ, Business Entities) và **Data Layer** (DAO/Repository, xử lý dữ liệu, Retrieval Service, Integration Adapters, nguồn dữ liệu).',
            'Trợ lý không phải tầng thứ tư — đây là năng lực hội thoại có thành phần ở cả ba tầng, dùng lại chính dịch vụ nghiệp vụ và cơ chế phân quyền của nền tảng.',
            `Quyền của bạn hiện tại: vai trò **${role.name}**, phạm vi ${role.scope.toLowerCase()}. Dữ liệu giá: ${can?'được xem':'bị ẩn'}. Phê duyệt: ${role.approve?'có, theo DOA':'không'}.`],
      src:[{l:'Trang kiến trúc', page:'arch', ref:''}] };

  // 13. hướng dẫn thao tác
  if (/\b(lam sao|lam the nao|cach|huong dan|o dau|tim o dau|su dung|dung the nao|bat dau tu dau|xem o dau)\b/.test(n))
    return { title:'Hướng dẫn nhanh',
      body:['Các lối đi chính trên hệ thống:'],
      list:[{t:'Xem việc cần xử lý', s:'Tổng quan'},
            {t:'Chấm và so sánh hồ sơ dự thầu', s:'Đấu thầu → chọn gói'},
            {t:'Tra hồ sơ và điểm Tier của NCC', s:'Nhà cung cấp → chọn dòng'},
            {t:'Theo dõi giao hàng, xem dòng thời gian PO', s:'PR/PO & giao hàng'},
            {t:'Kết quả IQC và truy xuất lô', s:'Chất lượng'},
            {t:'Scorecard, SCAR và CAPA', s:'Đánh giá & ESG'},
            {t:'Biểu đồ và sơ đồ dữ liệu', s:'Phân tích & mô hình'}],
      note:'Gõ mã hồ sơ vào ô tìm kiếm trên cùng để nhảy thẳng tới nó.',
      src:[] };

  // 14. không khớp
  return { title:'Tôi chưa chắc ý bạn',
    body:[`Chưa tìm thấy dữ liệu khớp với câu hỏi trong phạm vi ${role.scope.toLowerCase()}.`,
          'Bạn thử nêu mã hồ sơ cụ thể, hoặc hỏi theo một trong các hướng dưới đây.'],
    list:[{t:'"PO nào đang trễ giao?"'},{t:'"Tóm tắt NCC-0412"'},{t:'"OTIF trung bình là bao nhiêu?"'},
          {t:'"SCAR là gì?"'},{t:'"Vẽ biểu đồ chi tiêu"'}],
    note:'Tôi phân biệt dữ liệu có sẵn với suy luận — khi không có dữ liệu, tôi nói rõ thay vì phỏng đoán.',
    src:[] };
}

function draftEmail(p) {
  return { title:'Bản nháp email — bạn kiểm tra trước khi gửi',
    draft:`Kính gửi Quý ${p.vn},\n\nĐơn hàng ${p.code} (${p.mat}, ${p.qty}, giao tại ${p.plant}) có ngày giao cam kết ${p.promised.split('-').reverse().join('/')}${p.late? ' và hiện đã quá hạn '+p.late+' ngày':''}. ${p.late? 'Chúng tôi chưa nhận được ASN cập nhật cho đợt giao này.' : 'Chúng tôi xin xác nhận lại tiến độ giao hàng.'}\n\nĐề nghị Quý công ty xác nhận lịch giao trước 17h ngày làm việc kế tiếp, hoặc nêu rõ phương án giao từng phần để chúng tôi cân đối kế hoạch sản xuất.\n\nTrân trọng,\nBộ phận Thu mua — Masan Consumer`,
    note:'Tôi không tự gửi email. Bạn chỉnh sửa rồi gửi từ hộp thư của mình.',
    src:[{l:p.code, page:'po', ref:p.code}] };
}
/* ══════════════════════════════════════════════════════════════
   DỮ LIỆU SỐNG + TRỢ LÝ THẬT
   - db: thao tác của người dùng được ghi lại và mọi người mở link đều thấy
   - sample: trợ lý gọi Claude thật, có công cụ truy vấn / vẽ / điều hướng / ghi việc
   Cả hai đều có thể vắng mặt (chưa đăng nhập, từ chối quyền) → trang vẫn chạy.
   ══════════════════════════════════════════════════════════════ */

let OV_CUR = {};
const setOvCur = o => { OV_CUR = o; };
function getPOS(){ return POS.map(p=>withOv(OV_CUR,'po',p.code,p)); }
function getVENDORS(){ return VENDORS.map(v=>withOv(OV_CUR,'vendor',v.code,v)); }
function getLOTS(){ return LOTS.map(l=>withOv(OV_CUR,'lot',l.lot,l)); }
function getTENDERS(){ return TENDERS.map(t=>withOv(OV_CUR,'tender',t.code,t)); }
function getSCARS(){ return SCARS.map(s=>withOv(OV_CUR,'scar',s.code,s)); }
function getCONTRACTS(){ return CONTRACTS.map(c=>withOv(OV_CUR,'contract',c.code,c)); }

/* window.claude chỉ tồn tại khi trang chạy trong viewer của claude.ai */
const useCap = async (n) => { try { return (window.claude && window.claude.use)
  ? await window.claude.use(n) : null; } catch(e){ return null; } };

/* Khi không có kho dữ liệu dùng chung (bản host ngoài claude.ai), thao tác vẫn
   được giữ trên trình duyệt này để demo được trọn luồng — không chia sẻ cho người khác. */
const LS = { a:'mpo.activity.v1', o:'mpo.overrides.v1' };
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || (k===LS.a?'[]':'{}')); }
  catch(e){ return k===LS.a?[]:{}; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };

const KEY = (kind, ref) => kind + '__' + String(ref).replace(/[^A-Za-z0-9_-]/g, '-');

function useLive() {
  const [db, setDb] = useState(null);
  const [me, setMe] = useState(null);
  const [canWrite, setCanWrite] = useState(null);
  const [activity, setActivity] = useState([]);
  const [ov, setOv] = useState({});
  const [state, setState] = useState('connecting');

  useEffect(() => {
    let dead = false, unsubA = null, unsubO = null;
    const t = setTimeout(()=>{ if(!dead) setState(s=>s==='connecting'?'offline':s); }, 10000);
    (async () => {
      const d = await useCap('db');
      if (dead) return;
      if (!d) {                       // dự phòng: lưu trên trình duyệt này
        const ok = lsSet(LS.a, lsGet(LS.a));
        setActivity(lsGet(LS.a)); setOv(lsGet(LS.o));
        setState(ok ? 'local' : 'offline');
        return;
      }
      setDb(d); setState('live');
      const u = await useCap('user');
      if (!dead && u) {
        setMe(u);
        u.can('data.write').then(v=>!dead && setCanWrite(v)).catch(()=>{});
      }
      try {
        unsubA = d.collection('activity').orderBy('at','desc').limit(40)
          .onSnapshot(s=>{ if(!dead) setActivity(s.docs.map(x=>({id:x.id, ...x.data()}))); },
                      ()=>{ if(!dead) setState('offline'); });
        unsubO = d.collection('overrides')
          .onSnapshot(s=>{ if(!dead){ const m={}; s.docs.forEach(x=>{ m[x.id]=x.data(); }); setOv(m); } },
                      ()=>{});
      } catch(e){ setState('offline'); }
    })();
    return ()=>{ dead=true; clearTimeout(t); if(unsubA) unsubA(); if(unsubO) unsubO(); };
  }, []);

  const write = async (coll, id, body) => {
    if (!db) {
      if (state === 'offline') { window.__toast('Trình duyệt chặn lưu trữ — thao tác không được giữ lại','warn'); return false; }
      if (coll === 'activity') { const a = [{id, ...body}, ...lsGet(LS.a)].slice(0,60);
        if (!lsSet(LS.a, a)) return false; setActivity(a); }
      else { const o = lsGet(LS.o); o[id] = body;
        if (!lsSet(LS.o, o)) return false; setOv(o); }
      return true;
    }
    try { await db.collection(coll).doc(id).set(body); return true; }
    catch(e){
      window.__toast(e && e.code==='invalid_argument'
        ? 'Tài khoản của bạn chỉ có quyền xem, không ghi được dữ liệu' : 'Không lưu được thao tác','warn');
      return false;
    }
  };

  const act = async (p) => {
    const id = 'a-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6);
    let byId = null;
    try { byId = me ? await me.id() : null; } catch(e){}
    const body = { kind:p.kind||'action', title:p.title, detail:p.detail||'', ref:p.ref||'',
      page:p.page||'', role:p.role||'', by:byId||'', at:new Date().toISOString(),
      status:p.status||(p.kind==='request'?'open':'done') };
    const ok = await write('activity', id, body);
    if (ok) window.__toast(p.toast || 'Đã ghi vào nhật ký hoạt động');
    if (ok && p.override) await setOverride(p.override.kind, p.override.ref, p.override.data);
    return ok;
  };

  const setOverride = async (kind, ref, data) =>
    write('overrides', KEY(kind, ref), { kind, ref, ...data, at:new Date().toISOString() });

  const resolve = async (id) => {
    if (!db) {
      const a = lsGet(LS.a).map(x => x.id===id ? {...x, status:'done'} : x);
      if (lsSet(LS.a, a)) { setActivity(a); window.__toast('Đã đánh dấu yêu cầu đã xử lý'); }
      return;
    }
    try { await db.collection('activity').doc(id).update({ status:'done' });
      window.__toast('Đã đánh dấu yêu cầu đã xử lý'); } catch(e){ window.__toast('Không cập nhật được','warn'); }
  };

  return { db, me, canWrite, activity, ov, state, act, setOverride, resolve };
}

/* áp override lên bản ghi gốc */
function withOv(ov, kind, ref, base) {
  const o = ov[KEY(kind, ref)];
  if (!o) return base;
  const { kind:_k, ref:_r, at:_a, ...rest } = o;
  return { ...base, ...rest, _edited:true };
}
const LiveCtx = React.createContext(null);
const useLiveCtx = () => React.useContext(LiveCtx) || { activity:[], ov:{}, state:'offline', act:async()=>{} };

    </div></div>;

      <div style={{fontSize:11.5,fontWeight:600,color:'var(--warn)',marginBottom:6}}>
        {open.length} yêu cầu đang chờ xử lý</div>

        <div key={a.id} style={{display:'flex',gap:8,alignItems:'flex-start',padding:'5px 0'}}>
          <span style={{flex:1,fontSize:12.5}}>
            <button onClick={()=>a.page&&go(a.page,a.ref)} style={{textAlign:'left',fontWeight:500}}>{a.title}</button>
            {a.detail && <span className="t-meta" style={{display:'block'}}>{a.detail}</span>}

          {role.id!=='supplier' && <button className="btn sm" style={{flex:'none'}}

    <div className="card-b" style={{paddingTop:8}}>
      {recent.length===0
        ? <p className="t-meta" style={{lineHeight:1.5}}>
            Chưa có thao tác nào được ghi. Mọi hành động bạn làm trên hệ thống — trình kết quả,
            ghi kết luận lô, nhắc nhà cung cấp — sẽ xuất hiện ở đây{live.state==='live'
              ? ' và hiện với mọi người mở link.' : '. Bản này lưu trên trình duyệt của bạn, không chia sẻ cho người khác.'}</p>
        : recent.map((a,i)=>
          <div key={a.id} style={{display:'flex',gap:9,padding:'6px 0',
            borderBottom:i<recent.length-1?'1px dashed var(--line-soft)':'none'}}>
            <span style={{flex:'none',width:5,height:5,borderRadius:a.status==='open'?1:5,marginTop:6,
              background:a.status==='open'?'var(--warn)':'var(--ok)'}}/>
            <span style={{flex:1,minWidth:0}}>
              <span style={{display:'block',fontSize:12.5,fontWeight:450}}>{a.title}</span>
              <span className="t-meta" style={{fontSize:11}}>
                {a.ref? a.ref+' · ':''}{new Date(a.at).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',
                  day:'2-digit',month:'2-digit'})}</span>
            </span>
          </div>)}
    </div>
  </div>;
}

  const money = v => role.price ? v : null;
  return {
    nha_cung_cap: getVENDORS().map(v=>({ ma:v.code, ten:v.name, nhom_hang:v.cat, tier:v.tier,
      trang_thai:v.status, otif:v.otif, loi_ppm:v.ppm, diem_esg:v.esg, chi_tieu_ty:money(v.spend),
      ty_trong_pc:money(v.share), nha_may:v.plants, hop_tac_tu:v.since,
      chung_nhan:v.certs.map(c=>({ten:c.n,het_han:c.exp,trang_thai:c.st})),
      diem_tier:v.tierScore.map(s=>({tieu_chi:s.k,diem:s.v,can_cu:s.note})),
      otif_6thang:v.deliv.map(d=>({thang:d.m,otif:d.v})), ho_so_mo:v.open })),
    goi_thau: getTENDERS().map(t=>({ ma:t.code, ten:t.title, nhom_hang:t.cat, trang_thai:t.status,
      han:t.due, qua_han:t.overdue, phu_trach:t.owner, gia_tri_ty:money(t.value), nha_may:t.plants,
      tieu_chi:t.criteria, ho_so:t.bids.map(b=>({ncc:b.v, ten:b.name, gia_ty:money(b.price),
        ngay_giao:b.lead, diem_tung_tieu_chi:b.s, nhan_xet:b.note, thieu_sot:b.gap||null, trung:!!b.won})) })),
    don_hang: getPOS().map(p=>({ ma:p.code, ncc:p.v, ten_ncc:p.vn, vat_tu:p.mat, nha_may:p.plant,
      so_luong:p.qty, gia_tri_ty:money(p.value), ngay_giao_cam_ket:p.promised, trang_thai:p.status,
      so_ngay_tre:p.late, nguyen_nhan:p.reason||null, dong_thoi_gian:p.tl })),
    lo_hang: getLOTS().map(l=>({ ma_lo:l.lot, po:l.po, ncc:l.v, vat_tu:l.mat, nha_may:l.plant,
      ngay_nhan:l.recv, ket_luan:l.res, chi_tieu:l.tests, ncr:l.ncr||null, scar:l.scar||null })),
    scar: getSCARS().map(s=>({ ma:s.code, ncc:s.vn, lo:s.lot, phat_hanh:s.issued, han:s.due,
      trang_thai:s.st, van_de:s.issue, tien_do_capa:s.capa })),
    hop_dong: getCONTRACTS().map(c=>({ ma:c.code, ncc:c.vn, loai:c.type, phien_ban:c.ver, hieu_luc:c.eff,
      het_han:c.exp, trang_thai:c.st, dieu_khoan:c.terms })),
    viec_can_xu_ly: TASKS.filter(t=>t.roles.includes(role.id))
      .map(t=>({ muc_do:t.pri, sla:t.sla, viec:t.t, chi_tiet:t.w, ma:t.ref, trang:t.page })),
    mach_quy_trinh: CHAIN.map(c=>({ buoc:c.n, ten:c.t, ho_so_mo:c.count, can_xu_ly:c.hot, ghi_chu:c.note })),
  };
}

function AILive({open, onClose, page, role, ctx, go, live}) {
  const [turns, setTurns] = useState([]);     // {role:'user'|'assistant', content}
  const [cards, setCards] = useState({});     // index -> {chart}
  const [val, setVal] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [mode, setMode] = useState('probe');  // probe | live | scripted
  const ctlRef = useRef(null);
  const memRef = useRef({});
  const askRef = useRef(null);
  const endRef = useRef(null);
  const sampleRef = useRef(null);

  useEffect(()=>{ let dead=false;
    (async()=>{ const s = await useCap('sample');
      if(dead) return; sampleRef.current = s; setMode(s? 'live':'scripted'); })();
    return ()=>{dead=true;}; },[]);
  useEffect(()=>{ if(endRef.current) endRef.current.scrollIntoView({block:'end'}); },[turns,busy]);
  useEffect(()=>{ setTurns([]); setCards({}); setErr(null); },[role.id]);

  const tools = () => [
    { name:'ve_bieu_do', description:'Vẽ biểu đồ để trực quan hoá dữ liệu trong câu trả lời. Chọn dang="cot" cho so sánh độ lớn giữa các hạng mục, dang="duong" cho thay đổi theo thời gian. Trả về xác nhận đã vẽ.',
      inputSchema:{ type:'object', properties:{
        dang:{type:'string',enum:['cot','duong']}, tieu_de:{type:'string'}, don_vi:{type:'string'},
        du_lieu:{type:'array',description:'Với cot: [{nhan,gia_tri}]. Với duong: [{ten,cac_gia_tri:[số]}]'},
        truc_x:{type:'array',description:'Chỉ cho dang=duong: nhãn các mốc thời gian',items:{type:'string'}}
      }, required:['dang','tieu_de','du_lieu'] },
      execute: (i) => {
        const dang = String(i.dang||'cot'), unit = String(i.don_vi||'');
        if (dang==='duong') {
          const x = (i.truc_x||[]).map(String);
          const series = (i.du_lieu||[]).slice(0,4).map(s=>({ n:String(s.ten||s.nhan||''),
            v:(s.cac_gia_tri||s.gia_tri||[]).map(Number) }));
          const all = series.flatMap(s=>s.v).filter(n=>!isNaN(n));
          if (!series.length || !all.length) throw new Error('du_lieu rỗng hoặc sai định dạng');
          const lo=Math.min.apply(null,all), hi=Math.max.apply(null,all), pad=(hi-lo)*0.2||1;
          setCards(c=>({...c,[turnsLenRef.current]:{ kind:'line', title:i.tieu_de, x, series,
            yMin:Math.floor((lo-pad)/5)*5, yMax:Math.ceil((hi+pad)/5)*5, unit }}));
        } else {
          const rows = (i.du_lieu||[]).slice(0,12).map(r=>({ k:String(r.nhan||r.ten||''),
            v:Number(r.gia_tri||r.v||0), sub:r.ghi_chu?String(r.ghi_chu):undefined }))
            .filter(r=>r.k && !isNaN(r.v));
          if (!rows.length) throw new Error('du_lieu rỗng hoặc sai định dạng');
          setCards(c=>({...c,[turnsLenRef.current]:{ kind:'bar', title:i.tieu_de, rows, unit }}));
        }
        return 'Đã vẽ biểu đồ trong câu trả lời. Đừng lặp lại toàn bộ số liệu bằng chữ.';
      } },
    { name:'mo_ho_so', description:'Mở một màn hình hoặc hồ sơ cụ thể trên giao diện cho người dùng. Dùng khi người dùng muốn xem chi tiết.',
      inputSchema:{ type:'object', properties:{
        trang:{type:'string',enum:['overview','vendors','bidding','contracts','po','quality','scorecard','analytics','arch']},
        ma:{type:'string',description:'Mã hồ sơ, ví dụ PO-26-10-0471. Bỏ trống nếu chỉ mở màn hình.'} },
        required:['trang'] },
      execute: (i) => {
        const p = String(i.trang||'');
        if (!role.pages.includes(p)) throw new Error('Vai trò '+role.name+' không được truy cập màn hình này');
        go(p, i.ma? String(i.ma):undefined);
        return 'Đã mở màn hình '+(PAGE_TITLE[p]||p)+(i.ma?' tại hồ sơ '+i.ma:'')+' cho người dùng.';
      } },
    { name:'ghi_hoat_dong', description:'Ghi một việc cần theo dõi hoặc một yêu cầu vào nhật ký dùng chung của hệ thống — mọi người mở link đều thấy. KHÔNG dùng để phê duyệt. Chỉ gọi khi người dùng yêu cầu rõ ràng.',
      inputSchema:{ type:'object', properties:{
        tieu_de:{type:'string'}, chi_tiet:{type:'string'}, ma_ho_so:{type:'string'},
        la_yeu_cau:{type:'boolean',description:'true nếu đây là yêu cầu cần người khác xử lý'} },
        required:['tieu_de'] },
      execute: async (i) => {
        const ok = await live.act({ kind: i.la_yeu_cau?'request':'note', title:String(i.tieu_de),
          detail:String(i.chi_tiet||''), ref:String(i.ma_ho_so||''), role:role.name,
          toast:'Trợ lý đã ghi vào nhật ký hoạt động' });
        if (!ok) throw new Error('Không ghi được — có thể tài khoản chỉ có quyền xem');
        return 'Đã ghi vào nhật ký hoạt động dùng chung.';
      } },
  ];

  const turnsLenRef = useRef(0);

  const ask = async (q) => {
    const text = (q||'').trim();
    if (!text || busy) return;
    setErr(null); setVal('');
    const next = [...turns, {role:'user', content:text}];
    setTurns(next); setBusy(true);

    if (mode !== 'live' || !sampleRef.current) {      // dự phòng: kịch bản nội bộ
      setTimeout(()=>{ setTurns(t=>[...t,{role:'assistant', content:'', scripted:localAnswer(text,page,role,ctx,memRef.current)}]);
        setBusy(false); }, 420);
      return;
    }
    turnsLenRef.current = next.length;                 // chỉ số của câu trả lời sắp tới
    const ctl = new AbortController(); ctlRef.current = ctl;
    setTurns(t=>[...t,{role:'assistant', content:''}]);
    try {
      const { text:answer } = await sampleRef.current(
        [{role:'user', content:systemTurn(role, {page, label:ctx&&ctx.label}, live)}, ...next],
        { signal: ctl.signal, tools: tools(), modelTier:'default',
          onText: ({text:t}) => setTurns(x=>{ const c=[...x]; c[c.length-1]={role:'assistant',content:t}; return c; }) });
      setTurns(x=>{ const c=[...x]; c[c.length-1]={role:'assistant',content:answer}; return c; });
    } catch(e) {
      const code = e && e.code;
      if (code==='cancelled') {
        setTurns(x=>{ const c=[...x]; const last=c[c.length-1];
          c[c.length-1]={role:'assistant',content:(last.content||'')+'\n\n_(đã dừng)_'}; return c; });
      } else if (code==='not_granted' || code==='sampling_disabled' || code==='not_declared'
                 || code==='capability_disabled' || code==='tools_unavailable') {
        setMode('scripted');
        setTurns(x=>{ const c=[...x];
          c[c.length-1]={role:'assistant', content:'', scripted:localAnswer(text,page,role,ctx,memRef.current)}; return c; });
        setErr('Trợ lý đang chạy ở chế độ kịch bản nội bộ (chưa được cấp quyền gọi Claude).');
      } else {
        setTurns(x=>{ const c=[...x]; const last=c[c.length-1];
          if (!last.content && !e.text) c.pop(); else c[c.length-1]={role:'assistant',content:e.text||last.content};
          return c; });
        setErr(code==='rate_limited' ? 'Đã gọi quá nhiều lần, thử lại sau ít phút.'
             : code==='refused' ? 'Trợ lý từ chối nội dung này. Thử diễn đạt khác.'
             : code==='prompt_too_large' ? 'Cuộc hội thoại quá dài — bấm Hội thoại mới.'
             : 'Không nhận được trả lời. Thử lại hoặc hỏi ngắn hơn.');
      }
    } finally { setBusy(false); ctlRef.current = null; }
  };

  askRef.current = ask;
  useEffect(()=>{ window.__askAI = q => { if (askRef.current) askRef.current(q); }; },[]);

  if (!open) return null;
  const prompts = aiPrompts(page, role, ctx);

  return <aside className="ai-panel" aria-label="MPO AI Assistant">
    <div className="ai-h">
      <AIMark s={21}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13.5,fontWeight:600,letterSpacing:'-.01em'}}>MPO AI Assistant</div>
        <div className="t-meta" style={{fontSize:11}}>
          {role.name} · {mode==='live'?'chỉ đọc & soạn thảo':mode==='scripted'?'chế độ kịch bản':'đang khởi động'}</div>
      </div>
      {turns.length>0 && <button className="btn gho sm" onClick={()=>{setTurns([]);setCards({});setErr(null);}}
        title="Hội thoại mới"><I n="x" s={15}/></button>}
      <button className="btn gho sm" onClick={onClose} aria-label="Đóng trợ lý"><I n="chev" s={16}/></button>

    <div className="ai-ctx"><I n="link" s={13}/>
      <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>

    </div>
    <div className="ai-log">
      {turns.length===0 && <div>

          hay chỉ cần giải thích một khái niệm. Tôi làm việc trong đúng phạm vi quyền của bạn:

        </div>

      {turns.map((m,i)=> m.role==='user'

              {cards[i] && <AIChart spec={cards[i]}/>}

      {busy && turns.length && turns[turns.length-1].role==='user' &&

      {err && <div className="ai-note" style={{color:'var(--warn)'}}>{err}</div>}

        onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(val);} }}/>
      <div style={{display:'flex',alignItems:'center',gap:8,marginTop:7}}>

        </span>
        {busy
          ? <button className="btn sm" onClick={()=>ctlRef.current&&ctlRef.current.abort()}>Dừng</button>
          : <button className="btn pri sm" onClick={()=>ask(val)} disabled={!val.trim()}>

/* markdown tối giản: tiêu đề, gạch đầu dòng, **đậm**, `mã`, mã hồ sơ bấm được */
const REFRE = /\b((?:PO|GT|NCC|LOT|SCAR|NCR|PR|GRN)-[0-9A-Za-z-]+|HĐ-[0-9-]+|NDA-[0-9-]+)\b/g;
function inline(s, go, key) {
  const out = []; let last = 0, m;
  const push = (txt) => {
    let i = 0, mm;
    const re = new RegExp(REFRE.source, 'g');
    while ((mm = re.exec(txt))) {
      if (mm.index > i) out.push(txt.slice(i, mm.index));
      const ref = mm[1];
      const page = /^PO-/.test(ref)?'po' : /^GT-/.test(ref)?'bidding' : /^NCC-/.test(ref)?'vendors'
                 : /^LOT-/.test(ref)?'quality' : /^SCAR-/.test(ref)?'scorecard'
                 : /^(HĐ|NDA)-/.test(ref)?'contracts' : null;
      out.push(page
        ? <button key={key+'-r'+out.length} onClick={()=>go(page, ref)}
            style={{fontFamily:'var(--fm)',fontSize:12,color:'var(--brand)',fontWeight:500}}>{ref}</button>
        : ref);
      i = mm.index + ref.length;
    }
    if (i < txt.length) out.push(txt.slice(i));
  };
  const bold = /\*\*([^*]+)\*\*|`([^`]+)`/g;
  while ((m = bold.exec(s))) {
    if (m.index > last) push(s.slice(last, m.index));
    if (m[1]) out.push(<strong key={key+'-b'+out.length} style={{color:'var(--ink)'}}>{m[1]}</strong>);
    else out.push(<code key={key+'-c'+out.length} className="t-code">{m[2]}</code>);
    last = m.index + m[0].length;
  }
  if (last < s.length) push(s.slice(last));
  return out;
}
function Markdown({text, go}) {
  const lines = String(text).split('\n');
  const out = []; let list = null;
  const flush = () => { if(list){ out.push(<ul key={'u'+out.length}
    style={{margin:'0 0 8px',paddingLeft:17}}>{list}</ul>); list=null; } };
  lines.forEach((ln,i)=>{
    const t = ln.trim();
    if (!t) { flush(); return; }
    const li = t.match(/^[-*•]\s+(.*)$/) || t.match(/^(\d+)[.)]\s+(.*)$/);
    if (li) { const body = li[2]!==undefined? li[2] : li[1];
      (list = list||[]).push(<li key={'l'+i} style={{fontSize:13,color:'var(--ink-mid)',marginBottom:3}}>
        {inline(body, go, 'l'+i)}</li>); return; }
    flush();
    const h = t.match(/^#{1,4}\s+(.*)$/);
    if (h) { out.push(<div key={'h'+i} className="ai-title" style={{marginTop:out.length?9:0}}>
      {inline(h[1], go, 'h'+i)}</div>); return; }
    out.push(<p key={'p'+i}>{inline(t, go, 'p'+i)}</p>);
  });
  flush();
  return <React.Fragment>{out}</React.Fragment>;
}

                <span className="t-code" style={{color:'var(--ink-soft)',minWidth:74}}>
                  {e.d==='—'?'—':e.d.split('-').reverse().join('/')}</span>
                <span style={{fontSize:13,color:e.st==='wait'?'var(--ink-soft)':'var(--ink)'}}>{e.e}</span>
              </div></div>;})}
        </div>
      </React.Fragment>}
    </Drawer>
  </div>;
}

function PageSupplierCapa() {
  const mine = SCARS.filter(s=>s.v===ME);
  return <div className="page">
    <div className="page-head"><div style={{flex:1,minWidth:260}}>
      <h1 className="t-page">Yêu cầu khắc phục</h1>
      <p className="lede">Phản hồi SCAR và nộp hồ sơ CAPA kèm bằng chứng hiệu lực.</p>
    </div></div>
    <SupplierBanner/>
    {mine.length===0
      ? <Empty icon="check" t="Không có yêu cầu khắc phục nào đang mở"
          s="Tổ chức của bạn hiện không có SCAR cần phản hồi."/>
      : mine.map(s=><div key={s.code} className="card" style={{padding:'13px 15px',marginBottom:11}}>
          <div style={{display:'flex',gap:9,alignItems:'center',marginBottom:6,flexWrap:'wrap'}}>
            <span className="t-code">{s.code}</span>
            <Chip k={sevChip(s.sev)} sh={s.sev==='risk'?'tri':''}>{s.st}</Chip>
            <span className="t-meta" style={{marginLeft:'auto'}}>Hạn {s.due.split('-').reverse().join('/')}</span>
          </div>
          <p className="t-body" style={{fontSize:12.5,marginBottom:10}}>{s.issue}</p>
          {s.capa.map((c,i)=><div key={i} style={{display:'flex',gap:10,padding:'6px 0',fontSize:12.5,
            borderBottom:i<s.capa.length-1?'1px solid var(--line-soft)':'none'}}>
            <span style={{flex:1}}>{c.s}</span><span className="t-meta">{c.st}</span></div>)}
        </div>)}
  </div>;
}

/* ══ APP ════════════════════════════════════════════════════ */
function App() {
  const [roleId, setRoleId] = useState('mpo');
  const role = ROLES.find(r=>r.id===roleId);
  const [page, setPage] = useState('overview');
  const [sel, setSel] = useState({});
  const [ai, setAi] = useState(false);
  const [railOpen, setRailOpen] = useState(false);
  const [roleOpen, setRoleOpen] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [q, setQ] = useState('');
  const [hist, setHist] = useState([]);
  const [org, setOrg] = useState(ORGS[0]);
  const [orgOpen, setOrgOpen] = useState(false);
  const live = useLive();
  setOvCur(live.ov);

  useEffect(()=>{ window.__act = (p) => live.act(p); },[live]);
  useEffect(()=>{ window.__toast = (t,k) => {
    const id = Date.now()+Math.random();
    setToasts(x=>[...x,{id,t,k}]);
    setTimeout(()=>setToasts(x=>x.filter(y=>y.id!==id)), 3600);
  }; },[]);

  // đổi vai trò → về trang đầu tiên mà vai trò đó được phép xem
  useEffect(()=>{ if(!role.pages.includes(page)) setPage(role.pages[0]); setSel({}); setHist([]); },[roleId]);

  const go = (p, ref) => {
    if (!role.pages.includes(p)) { window.__toast('Vai trò '+role.name+' không được truy cập mục này','warn'); return; }
    const same = p===page && (ref===undefined || ref===null || ref==='' || sel[p]===ref);
    if (!same) setHist(h=>[...h.slice(-24), {page, sel:{...sel}}]);
    setPage(p); setRailOpen(false);
    if (ref !== undefined && ref !== null && ref !== '') setSel(s=>({...s,[p]:ref}));
  };
  const back = () => setHist(h=>{
    if (!h.length) return h;
    const prev = h[h.length-1];
    setPage(prev.page); setSel(prev.sel); setRailOpen(false);
    return h.slice(0,-1);
  });
  useEffect(()=>{ const k=e=>{ if((e.altKey&&e.key==='ArrowLeft')||e.key==='Backspace'&&e.target===document.body) back(); };
    window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k); });
  const setSelFor = p => v => setSel(s=>({...s,[p]:v}));
  const openAI = (q0) => {
    setAi(true);
    setTimeout(()=>{
      if (q0 && window.__askAI) window.__askAI(q0);
      else { const el = document.getElementById('ai-input'); if(el) el.focus(); }
    }, 260);
  };
  useEffect(()=>{ window.__openAI = openAI; });

  // ngữ cảnh truyền cho trợ lý
  const ctx = useMemo(()=>{
    const r = sel[page];
    if (page==='vendors' && r) { const v=VENDORS.find(x=>x.code===r); return v&&{label:v.name, vendor:v}; }
    if (page==='bidding' && r) { const t=TENDERS.find(x=>x.code===r); return t&&{label:t.code+' — '+t.title, tender:t}; }
    if ((page==='po'||page==='s_orders') && r) { const p=POS.find(x=>x.code===r); return p&&{label:p.code, po:p}; }
    if (page==='quality' && r) { const l=LOTS.find(x=>x.lot===r); return l&&{label:l.lot, lot:l}; }
    if (page==='scorecard' && r) { const s=SCARS.find(x=>x.code===r); return s&&{label:s.code, scar:s}; }
    if (page==='contracts' && r) { const c=CONTRACTS.find(x=>x.code===r); return c&&{label:c.code, contract:c}; }
    return null;
  },[page, sel]);

  const alerts = TASKS.filter(t=>t.roles.includes(role.id) && t.pri!=='info').length
    + live.activity.filter(a=>a.status==='open').length;
  const nav = role.portal==='supplier' ? NAV_SUPPLIER : NAV_PURCHASE;
  const common = { role, go, sel:sel[page]||null, setSel:setSelFor(page), openAI };

  let body;
  switch(page){
    case 'overview':  body = <PageOverview role={role} go={go} openAI={openAI} live={live}/>; break;
    case 'vendors':   body = <PageVendors {...common}/>; break;
    case 'bidding':   body = <PageBidding {...common}/>; break;
    case 'contracts': body = <PageContracts {...common}/>; break;
    case 'po':        body = <PagePO {...common}/>; break;
    case 'quality':   body = <PageQuality {...common}/>; break;
    case 'scorecard': body = <PageScorecard {...common}/>; break;
    case 'analytics': body = <PageAnalytics role={role} go={go}/>; break;
    case 'arch':      body = <PageArch/>; break;
    case 's_home':    body = <PageSupplierHome go={go} openAI={openAI}/>; break;
    case 's_profile': body = <PageSupplierProfile/>; break;
    case 's_tenders': body = <PageSupplierTenders/>; break;
    case 's_orders':  body = <PageSupplierOrders sel={sel[page]||null} setSel={setSelFor(page)}/>; break;
    case 's_capa':    body = <PageSupplierCapa/>; break;
    default:          body = <Empty t="Trang không khả dụng" s="Vai trò hiện tại không truy cập được mục này."/>;
  }

  return <LiveCtx.Provider value={live}><div className="shell">
    {railOpen && <div className="scrim" style={{zIndex:69}} onClick={()=>setRailOpen(false)}/>}
    <nav className={'rail'+(railOpen?' open':'')} aria-label="Điều hướng chính">
      <div className="rail-top"><Logo/></div>
      <div className="rail-scroll">
        {nav.map(g=>{
          const items = g.items.filter(it=>role.pages.includes(it.p));
          if (!items.length) return null;
          return <div key={g.g} className={'navgrp'+(g.chain?' chain':'')}>
            <div className="navgrp-h"><span className="t">{g.g}</span><span className="ln"/></div>
            {items.map(it=>
              <button key={it.p} className={'navitem'+(page===it.p?' on':'')} onClick={()=>go(it.p)}>
                <I n={it.i} s={16}/><span style={{flex:1}}>{it.t}</span>
                {it.n!=null && <span className={'cnt'+(it.hot?' hot':'')}>{it.n}</span>}
              </button>)}
          </div>;
        })}
      </div>
      <div style={{flex:'none',padding:'10px 12px',borderTop:'1px solid var(--line-soft)'}}>
        <div className="demo-pill"><I n="alert" s={11}/>Dữ liệu demo</div>
        <p className="t-meta" style={{fontSize:11,marginTop:7,lineHeight:1.45}}>
          Bài tập môn Phân tích & thiết kế hệ thống. Không phải sản phẩm hay dữ liệu của Masan Consumer.
        </p>
      </div>
    </nav>

    <div className="main">
      <header className="topbar">
        <button className="btn gho sm menu-btn" onClick={()=>setRailOpen(true)} aria-label="Mở menu">
          <I n="menu" s={17}/></button>
        <button className="iconbtn only-wide" title="Các phân hệ khác"
          onClick={()=>window.__toast('Các phân hệ khác nằm ngoài phạm vi đồ án')}><I n="apps" s={17}/></button>
        <div style={{position:'relative'}} className="only-wide">
          <button className="orgsel" onClick={()=>setOrgOpen(o=>!o)} aria-expanded={orgOpen}>
            <I n="box" s={14}/><span className="nm">{org}</span><I n="chevD" s={13}/>
          </button>
          {orgOpen && <React.Fragment>
            <div style={{position:'fixed',inset:0,zIndex:49}} onClick={()=>setOrgOpen(false)}/>
            <div className="pop" style={{left:0,top:34,width:272}}>
              <div className="t-sec" style={{fontSize:10.5,padding:'6px 9px 4px'}}>Đơn vị thu mua</div>
              {ORGS.map(o=>
                <button key={o} className={'popitem'+(o===org?' on':'')}
                  onClick={()=>{setOrg(o);setOrgOpen(false);window.__toast('Đã chuyển phạm vi: '+o);}}>{o}</button>)}
            </div></React.Fragment>}
        </div>
        <span className="vsep only-wide"/>
        <button className="btn sm" onClick={back} disabled={!hist.length}
          title={hist.length? 'Quay lại '+(PAGE_TITLE[hist[hist.length-1].page]||'') : 'Chưa có màn hình trước đó'}
          aria-label="Quay lại màn hình trước">
          <I n="arrowL" s={16}/><span className="only-wide">Quay lại</span></button>
        <div className="srch only-wide">
          <I n="search" s={15}/>
          <input value={q} onChange={e=>setQ(e.target.value)}
            placeholder="Tìm PO, gói thầu, NCC, lô hàng…"
            onKeyDown={e=>{ if(e.key!=='Enter') return;
              const v=q.trim().toUpperCase();
              if(/^PO-/.test(v)) go('po',v); else if(/^GT-/.test(v)) go('bidding',v);
              else if(/^NCC-/.test(v)) go('vendors',v); else if(/^LOT-/.test(v)) go('quality',v);
              else if(/^SCAR-/.test(v)) go('scorecard',v);
              else window.__toast('Không tìm thấy hồ sơ khớp mã "'+q+'"','warn');
              setQ(''); }}/>
        </div>
        <div style={{flex:1}}/>
        <span className={'chip only-wide '+(live.state==='live'?'ok':live.state==='local'?'info':'')}
          title={live.state==='live' ? 'Thao tác được lưu và hiện với mọi người mở link này'
            : live.state==='local' ? 'Thao tác được giữ trên trình duyệt này, không chia sẻ cho người khác'
            : 'Thao tác sẽ không được lưu lại'}>
          <i className="dot"/>{live.state==='live'?'Dữ liệu trực tiếp':live.state==='local'?'Lưu trên máy này'
            :live.state==='connecting'?'Đang kết nối':'Ngoại tuyến'}
        </span>

        {/* Chuyển vai trò — Bảng 3.3 */}
        <div style={{position:'relative'}}>
          <button className="btn sm" onClick={()=>setRoleOpen(o=>!o)} aria-expanded={roleOpen}>
            <span style={{width:21,height:21,borderRadius:21,background:'var(--brand-wash)',color:'var(--brand-700)',
              display:'grid',placeItems:'center',fontSize:10.5,fontWeight:700,flex:'none'}}>
              {role.name.split(' ').slice(-2).map(w=>w[0]).join('').toUpperCase().slice(0,2)}</span>
            <span className="only-wide">{role.name}</span>
            <I n="chevD" s={14}/>
          </button>
          {roleOpen && <React.Fragment>
            <div style={{position:'fixed',inset:0,zIndex:49}} onClick={()=>setRoleOpen(false)}/>
            <div style={{position:'absolute',right:0,top:36,width:316,zIndex:50,background:'var(--surface)',
              border:'1px solid var(--line)',borderRadius:'var(--r-lg)',boxShadow:'var(--sh-pop)',
              maxHeight:'72vh',overflowY:'auto',padding:5}}>
              <div style={{padding:'7px 9px 5px'}}>
                <div className="t-sec" style={{fontSize:10.5}}>Chuyển vai trò — Bảng 3.3</div>
                <p className="t-meta" style={{fontSize:11,marginTop:3,lineHeight:1.4}}>
                  Đổi vai trò sẽ đổi menu, cột dữ liệu hiển thị và gợi ý của trợ lý.</p>
              </div>
              {ROLES.map(r=>
                <button key={r.id} onClick={()=>{setRoleId(r.id);setRoleOpen(false);}}
                  style={{display:'block',width:'100%',textAlign:'left',padding:'7px 9px',borderRadius:'var(--r)',
                    background:r.id===roleId?'var(--brand-wash)':'transparent'}}
                  onMouseEnter={e=>{ if(r.id!==roleId) e.currentTarget.style.background='var(--surface-sunk)'; }}
                  onMouseLeave={e=>{ if(r.id!==roleId) e.currentTarget.style.background='transparent'; }}>
                  <div style={{display:'flex',gap:7,alignItems:'center'}}>
                    <span style={{fontSize:13,fontWeight:r.id===roleId?600:500,
                      color:r.id===roleId?'var(--brand-700)':'var(--ink)'}}>{r.name}</span>
                    {r.portal==='supplier' && <Chip k="acc">Cổng NCC</Chip>}
                  </div>
                  <div className="t-meta" style={{fontSize:11,marginTop:1}}>{r.scope}</div>
                </button>)}
            </div>
          </React.Fragment>}
        </div>

        <span className="vsep only-wide"/>
        <button className="iconbtn only-wide" title="Thông báo"
          onClick={()=>go('overview')}>
          <I n="bell" s={17}/>
          {alerts>0 && <span className="badge">{alerts>99?'99+':alerts}</span>}
        </button>
        <button className="iconbtn only-wide" title="Thiết lập hệ thống"
          onClick={()=>go('arch')}><I n="gear" s={17}/></button>
        <button className="iconbtn only-wide" title="Hướng dẫn sử dụng"
          onClick={()=>openAI('Hướng dẫn tôi cách dùng hệ thống')}>
          <I n="help" s={17}/></button>
        <span className="vsep only-wide"/>
        <button className={'btn sm '+(ai?'':'')} onClick={()=>setAi(a=>!a)}
          style={ai?{borderColor:'var(--accent-line)',background:'var(--accent-wash)',color:'var(--accent)'}:null}>
          <AIMark s={16}/><span className="only-wide">Trợ lý</span>
        </button>
      </header>

      <div style={{flex:1,display:'flex',minHeight:0}}>
        <div className="work">{body}</div>
        <AILive open={ai} onClose={()=>setAi(false)} page={page} role={role} ctx={ctx} go={go} live={live}/>
      </div>
    </div>

    <div className="toasts">{toasts.map(t=>
      <div key={t.id} className={'toast '+(t.k||'')}>
        <I n={t.k==='warn'?'alert':'check'} s={15}/>{t.t}</div>)}</div>
  </div></LiveCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
